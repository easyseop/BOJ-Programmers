<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 공부</title>
<style>
  :root{--accent:#8b7fc4;--accent-d:#6b5fae;--line:#e6e3f0;--bg:#f4f4f6;
        --card:#fff;--ink:#222;--muted:#777;--mark:#e9e6f3;--gold:#e8b53d;--ok:#5bbb72;}
  [data-theme="dark"]{--line:#33304a;--bg:#16151f;--card:#201e2d;--ink:#e8e6f0;
        --muted:#9a95b5;--mark:#2e2b42;--accent:#9d92d6;--accent-d:#b3a9e6;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--line:#33304a;--bg:#16151f;--card:#201e2d;--ink:#e8e6f0;
        --muted:#9a95b5;--mark:#2e2b42;--accent:#9d92d6;--accent-d:#b3a9e6;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  ruby rt{font-size:.5em;color:var(--muted);font-weight:400}
  .wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
  header .inner{max-width:748px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:15px;margin:0}
  .modes{display:flex;gap:4px;background:var(--mark);padding:3px;border-radius:20px}
  .mode{border:none;background:none;color:var(--muted);padding:5px 14px;border-radius:17px;font-size:13px;cursor:pointer;font-weight:600}
  .mode.active{background:var(--card);color:var(--accent-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ic{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
      padding:6px 10px;border-radius:20px;font-size:13px;cursor:pointer}
  .chbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(82px,1fr);gap:8px;margin:14px 0 0;overflow-x:auto;padding-bottom:2px}
  .chb{border:2px solid var(--line);background:var(--card);color:var(--muted);padding:8px 4px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.3;text-align:center}
  .chb .n{font-size:11px;font-weight:400;display:block}
  .chb.active{border-color:var(--accent);color:var(--accent-d);background:var(--mark)}
  /* 탭: 3칸 균등 세그먼트 */
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:14px 0 0;
        background:var(--mark);padding:4px;border-radius:14px}
  .tab{border:none;background:none;color:var(--muted);padding:9px 0;border-radius:10px;
       font-size:14px;font-weight:700;cursor:pointer}
  .tab.active{background:var(--card);color:var(--accent-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  /* 필터 칩: 같은 크기 칸으로 정렬 (모바일 cN칸 / 넓은 화면 dN칸) */
  .filters{display:grid;gap:6px;margin:10px 0 0;grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (min-width:640px){
    .filters.d3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .filters.d4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .filters.d6{grid-template-columns:repeat(6,minmax(0,1fr))}
    .filters.d8{grid-template-columns:repeat(8,minmax(0,1fr))}
  }
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
        padding:0 4px;min-height:36px;border-radius:10px;font-size:13px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;text-align:center;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
  .empty .chip,.feed .nextb,.tin .chip{display:inline-flex;padding:0 18px}
  .chip.active{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
  .progress{margin:14px 2px 0;font-size:12px;color:var(--muted)}
  .bar{height:8px;background:var(--mark);border-radius:6px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0}
  .search{width:100%;padding:11px 14px;margin:12px 0 4px;border:1px solid var(--line);
          border-radius:10px;font-size:15px;background:var(--card);color:var(--ink)}
  .count{color:var(--muted);font-size:12px;margin:6px 2px 12px}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 2px 0}
  /* 한자 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 6px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative}
  .cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(110,95,174,.15);border-color:var(--accent)}
  .cell.learned{border-color:var(--ok)}
  .cell .k{font-size:34px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
  .cell .m{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .lv{position:absolute;top:6px;left:7px;font-size:9px;color:var(--muted);opacity:.7}
  .cell .fav{position:absolute;top:3px;right:5px;font-size:14px;color:var(--line);cursor:pointer;line-height:1}
  .cell .fav.on{color:var(--gold)}
  .cell .chk{position:absolute;bottom:4px;right:6px;font-size:11px;color:var(--ok);opacity:0}
  .cell.learned .chk{opacity:1}
  /* 단어 목록 */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.learned{border-color:var(--ok)}
  .row .jp{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:24px;line-height:1.5}
  .row .mean{margin-left:auto;text-align:right;font-size:15px;font-weight:600}
  .row .tagc{font-size:10px;color:var(--muted);display:block;font-weight:400;margin-top:2px}
  .mini{border:none;background:none;cursor:pointer;font-size:17px;opacity:.5;padding:2px}
  .mini:hover,.mini.on{opacity:1}
  .kl{color:inherit;text-decoration:none;border-bottom:1.5px dotted var(--accent);cursor:pointer}
  .kl:hover,.kl:active{color:var(--accent-d);background:var(--mark);border-radius:4px}
  /* 상세 */
  .nav{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px}
  .nav a{color:var(--accent-d);cursor:pointer;font-size:14px;font-weight:600;user-select:none}
  .nav a.dim{opacity:.3;pointer-events:none}
  .title{font-size:25px;font-weight:800;margin:2px 0;text-align:center}
  .stroke{text-align:center;margin:8px 0}
  .stroke svg{width:170px;height:170px}
  .stroke svg path{stroke:var(--ink)!important}
  .bigk{font-size:118px;line-height:1.05;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;margin:6px 0}
  .meta{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}
  .actions{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 15px;font-size:13px;cursor:pointer;color:var(--muted)}
  .btn.fav.on{background:#fef6e0;border-color:var(--gold);color:#9a7415}
  .btn.chk.on{background:#eafaef;border-color:var(--ok);color:#2e7d46}
  .sec{margin-top:28px}
  .sec h2{font-size:19px;color:var(--accent-d);margin:0;padding:6px 0 12px 14px;
          border-left:6px solid var(--accent);border-bottom:1px solid var(--line)}
  .sub{font-weight:700;color:var(--accent-d);font-size:15px;border-left:5px solid var(--accent);
       padding-left:10px;margin:18px 0 10px}
  .mark{background:var(--mark);padding:1px 7px;border-radius:5px;font-weight:700;margin-right:8px}
  ul{margin:10px 0;padding-left:20px}
  li{margin:6px 0}
  .ko{margin-left:6px}
  .note{color:var(--ink);opacity:.85}
  .jp{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px}
  .spk{cursor:pointer;border:none;background:none;font-size:15px;opacity:.55;margin-left:4px;color:inherit}
  .spk:hover{opacity:1}
  .en{color:var(--muted);font-size:13px}
  .todo{color:var(--muted);font-size:13px;background:var(--mark);border:1px dashed var(--line);
        border-radius:8px;padding:10px 12px;margin-top:8px}
  .tip{background:linear-gradient(135deg,#fff7e0,#fdeccb);border:1px solid #f0d089;
       border-radius:10px;padding:11px 14px;margin-top:12px;font-size:14px;color:#7a5a12}
  [data-theme="dark"] .tip{background:#3a3320;border-color:#6b5a2a;color:#e9d59b}
  .tip b{color:#b8860b}
  [data-theme="dark"] .tip b{color:#e8b53d}
  .backbar{background:var(--mark);border:1px solid var(--line);border-radius:10px;
           padding:9px 13px;margin-top:12px;font-size:13px;cursor:pointer;color:var(--accent-d);font-weight:600}
  /* 카드 */
  .fc{perspective:1200px;max-width:430px;margin:8px auto 0}
  .fcard{position:relative;display:grid;min-height:330px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
  .fcard.flip{transform:rotateY(180deg)}
  .face{grid-area:1/1;position:relative;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);
        border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .face.b{transform:rotateY(180deg)}
  .face .big{font-size:120px;font-family:"Yu Mincho",serif;line-height:1}
  .face .bigw{font-size:42px;font-family:"Yu Mincho",serif;line-height:1.5}
  .face .krbig{font-size:28px;font-weight:800;margin:4px 0}
  .face .rd{font-size:19px;color:var(--muted);font-family:"Yu Mincho",serif;margin-top:6px}
  .face .ko{font-size:25px;font-weight:800;margin:2px 0 4px}
  .face .en{color:var(--muted);font-size:13px;margin:0 0 6px}
  .fc-label{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
        border-radius:10px;padding:2px 10px;margin:8px 0 6px;letter-spacing:1px}
  .fc-read{margin:9px 0 0;text-align:center}
  .fc-read .rdl{font-size:16px;line-height:1.7}
  .fc-tag{font-size:10px;font-weight:700;color:#fff;border-radius:9px;padding:2px 8px;margin-right:6px}
  .fc-tag.on{background:var(--accent-d)} .fc-tag.kun{background:var(--ok)}
  .fc-ex{margin-top:3px}
  .fc-ex .jp{font-size:17px;font-weight:400}
  .fc-ex .ko{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
  .fc .fhint{color:var(--muted);font-size:12px;margin-top:10px}
  .fcbtns{display:flex;gap:12px;max-width:430px;margin:14px auto 0}
  .fcbtns button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:15px;cursor:pointer;background:var(--card);color:var(--ink)}
  .fcbtns .know{border-color:var(--ok);color:#2e7d46}
  .fcbtns .dunno{border-color:#d99;color:#b35}
  .navline{display:flex;justify-content:space-between;align-items:center;margin:12px auto 0;max-width:430px}
  .navline button{border:1px solid var(--line);background:var(--card);color:var(--accent-d);
       border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .navline button:disabled{opacity:.3;cursor:default}
  /* 퀴즈 */
  .quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin-top:14px;text-align:center}
  .quiz .q{font-size:80px;font-family:"Yu Mincho",serif;margin:4px 0 14px;line-height:1.2}
  .quiz .qw{font-size:40px;font-family:"Yu Mincho",serif;margin:4px 0 14px;line-height:1.4}
  .quiz .prompt{color:var(--muted);font-size:14px;margin-bottom:10px}
  .opts{display:grid;gap:10px;max-width:440px;margin:0 auto}
  .opt{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:15px}
  .opt:hover{border-color:var(--accent)}
  .opt.ok{background:#e3f5e8;border-color:var(--ok);color:#1c1c1c}
  .opt.no{background:#fbe6e6;border-color:#d97a7a;color:#1c1c1c}
  .score{margin-top:14px;color:var(--muted);font-size:13px}
  .quiz .qko{font-size:26px;font-weight:800;margin:6px 0 16px;line-height:1.4}
  .spk.big{font-size:17px;padding:12px 22px;margin:4px 0 16px;opacity:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:700}
  .tin{display:flex;gap:8px;max-width:360px;margin:0 auto}
  .tin input{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:18px;background:var(--bg);color:var(--ink)}
  .tin input:focus{outline:none;border-color:var(--accent)}
  .tin input.ok{border-color:var(--ok)} .tin input.no{border-color:#d97a7a}
  .linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:10px;cursor:pointer}
  .feed{margin:16px auto 0;max-width:440px;border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--bg)}
  .feed.good{border-color:var(--ok)} .feed.bad{border-color:#d97a7a}
  .feed .fh{font-weight:800;font-size:15px}
  .feed .fw{font-size:28px;font-family:"Yu Mincho",serif;margin:6px 0 0}
  .feed .fk{font-weight:700;margin-top:2px}
  .feed .nextb{margin-top:12px}
  .kbrk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
  .kb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--mark);border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .kb b{font-family:"Yu Mincho",serif;font-size:19px;font-weight:400}
  .empty{color:var(--muted);text-align:center;padding:36px}
  @media (max-width:430px){h1 .t{display:none}}
  .filters.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
  /* 문법 */
  .gbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
  .gbox h3{margin:0 0 6px;font-size:15px}
  .gi{padding:9px 0;border-top:1px dashed var(--line)} .gi:first-of-type{border-top:none;padding-top:2px}
  .gtips{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
  .gtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:2px 8px;margin-right:6px;vertical-align:middle;background:var(--accent);white-space:nowrap}
  .gtag[data-k="겸양어"]{background:var(--ok)} .gtag[data-k="정중어"]{background:var(--gold)} .gtag[data-k="특별경어"]{background:var(--accent-d)}
  .gh{display:flex;align-items:center;gap:6px}
  .gt{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:24px;flex:1;line-height:1.4}
  .gm{font-weight:800;margin:4px 0 2px}
  .gf{font-size:13px;color:var(--muted);margin-bottom:4px}
  .gex{padding:8px 11px;background:var(--bg);border-radius:10px;margin-top:6px}
  .gex .jp{font-size:18px;line-height:1.9}
  .gex .ko{font-size:13px;color:var(--muted)}
  .gnote{font-size:13px;margin-top:8px;background:var(--mark);border-radius:8px;padding:7px 10px;line-height:1.9}
  .gtbl{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
  .gtbl th{font-size:12px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
  .gtbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:15px;line-height:1.8;word-break:keep-all}
  .gtbl .ko{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:11px;color:var(--muted);display:block;line-height:1.3}
  .gtbl .none{color:var(--muted)}
  .gq{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:21px;line-height:2.1;margin:4px 0 6px}
  .gqk{font-size:13px;color:var(--muted);margin-bottom:14px}
  .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);height:1.1em;vertical-align:baseline}
  .hl{background:var(--mark);border-radius:4px;padding:0 3px;color:var(--accent-d);font-weight:700}
  .opt .jp{font-size:17px}
  .ord-ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:8px 0;margin:6px auto 14px;max-width:460px}
  .ord-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;margin:0 auto}
  .ord-c{border:1px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:4px 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:18px;line-height:1.9;cursor:pointer;color:var(--ink)}
  .ord-c.used{visibility:hidden}
  .ord-go{margin:16px auto 0;max-width:200px}
  .hide{display:none}
</style>
</head>
<body>
<header><div class="inner">
  <h1>🇯🇵 <span class="t">일본어 공부</span></h1>
  <div class="modes">
    <button class="mode active" data-mode="kanji">📚 한자</button>
    <button class="mode" data-mode="vocab">📖 단어장</button>
    <button class="mode" data-mode="grammar">📝 문법</button>
  </div>
  <button class="ic" id="theme" title="다크 모드">🌙</button>
</div></header>

<div class="wrap">
  <!-- ════ 한자 ════ -->
  <div id="m-kanji">
    <div class="tabs" id="kTabs">
      <button class="tab active" data-kv="list">목록</button>
      <button class="tab" data-kv="card">카드</button>
      <button class="tab" data-kv="quiz">퀴즈</button>
    </div>
    <div id="k-list">
      <div class="filters c3 d6" id="kLv"></div>
      <div class="filters c3" id="kSt"></div>
      <div class="progress" id="kProg"></div>
      <input class="search" id="kSearch" placeholder="한자·뜻·읽기·로마자 검색 (예: 日, 날, ニチ, nichi, day)">
      <div class="count" id="kCount"></div>
      <div class="grid" id="kGrid"></div>
    </div>
    <div id="k-detail" class="hide"></div>
    <div id="k-card" class="hide"></div>
    <div id="k-quiz" class="hide"></div>
  </div>

  <!-- ════ 단어장 ════ -->
  <div id="m-vocab" class="hide">
    <div class="chbar" id="vChBar"></div>
    <div class="tabs" id="vTabs">
      <button class="tab active" data-vv="list">목록</button>
      <button class="tab" data-vv="card">카드</button>
      <button class="tab" data-vv="quiz">퀴즈</button>
    </div>
    <div id="v-list">
      <div class="filters c4 d8" id="vTy"></div>
      <div class="filters c3" id="vSt"></div>
      <div class="progress" id="vProg"></div>
      <div class="hint">💡 한자에 밑줄이 있으면 눌러서 한자 상세를 볼 수 있어요</div>
      <input class="search" id="vSearch" placeholder="단어·읽기·뜻·로마자 검색 (예: 写真, しゃしん, 사진, shashin)">
      <div class="count" id="vCount"></div>
      <div class="list" id="vList"></div>
    </div>
    <div id="v-card" class="hide"></div>
    <div id="v-quiz" class="hide"></div>
  </div>

  <!-- ════ 문법 ════ -->
  <div id="m-grammar" class="hide">
    <div class="chbar" id="gTopicBar"></div>
    <div class="tabs" id="gTabs">
      <button class="tab active" data-gv="list">설명</button>
      <button class="tab" data-gv="card">카드</button>
      <button class="tab" data-gv="quiz">퀴즈</button>
    </div>
    <div class="filters c5" id="gKind"></div>
    <div id="g-list"></div>
    <div id="g-card" class="hide"></div>
    <div id="g-quiz" class="hide"></div>
  </div>

え)りいたしました"],"k":"부장님은 벌써 돌아가셨습니다.","why":"부장님(상대)의 행동 → 존경어 お〜になる. お〜する는 겸양어예요."}]},{"id":"k02","topic":"경어","kind":"존경어","title":"ご〜になる","form":"ご + 한자어(する동사) + になる","mean":"~하시다 (한자어 동사의 존경)","ex":[["お客様(きゃくさま)は/もう/ご出発(しゅっぱつ)に/なりました。","손님은 벌써 출발하셨습니다."],["先生(せんせい)は/この部屋(へや)を/ご利用(りよう)に/なります。","선생님은 이 방을 이용하십니다."]],"note":"利用(りよう)・出発(しゅっぱつ)・説明(せつめい)처럼 한자어에는 お 대신 ご를 붙여요.","q":[{"s":"社長(しゃちょう)は 明日(あした) ＿＿。","a":"ご出発(しゅっぱつ)になります","o":["お出発(しゅっぱつ)になります","ご出発(しゅっぱつ)します","出発(しゅっぱつ)になります"],"k":"사장님은 내일 출발하십니다.","why":"한자어 出発 → ご. 사장님의 행동이니 になる(존경)."}]},{"id":"k03","topic":"경어","kind":"존경어","title":"〜(ら)れる","form":"1그룹 ない형 + れる / 2그룹 + られる / する → される / 来る → 来(こ)られる","mean":"~하시다 (수동형과 같은 모양의 존경)","ex":[["先生(せんせい)が/新(あたら)しい本(ほん)を/書(か)かれました。","선생님이 새 책을 쓰셨습니다."],["部長(ぶちょう)は/何時(なんじ)に/来(こ)られますか。","부장님은 몇 시에 오십니까?"]],"note":"お〜になる보다 조금 가벼운 존경. 수동형(~당하다)과 모양이 같으니 문맥으로 구별해요.","q":[{"s":"社長(しゃちょう)は 毎朝(まいあさ) 新聞(しんぶん)を ＿＿。","a":"読(よ)まれます","o":["読(よ)ませます","読(よ)めます","お読(よ)みします"],"k":"사장님은 매일 아침 신문을 읽으십니다.","why":"読む → 読まれる(존경). 読ませる는 사역, 読める는 가능형이에요."}]},{"id":"k04","topic":"경어","kind":"존경어","title":"お〜ください","form":"お + 동사 ます형 + ください / ご + 한자어 + ください","mean":"~해 주십시오 (〜てください의 공손한 말)","ex":[["少々(しょうしょう)/お待(ま)ち/ください。","잠시 기다려 주십시오."],["こちらの/エレベーターを/ご利用(りよう)/ください。","이쪽 엘리베이터를 이용해 주십시오."]],"note":"가게·역 안내 방송에서 정말 자주 들려요.","q":[{"s":"少々(しょうしょう) ＿＿ください。","a":"お待(ま)ち","o":["お待(ま)って","ご待(ま)ち","待(ま)ちに"],"k":"잠시 기다려 주십시오.","why":"お + ます형(待ち) + ください. 待つ는 고유어라 ご가 아니라 お."}]},{"id":"k05","topic":"경어","kind":"겸양어","title":"お〜する / いたす","form":"お + 동사 ます형 + する(いたす) / ご + 한자어 + する(いたす)","mean":"(제가) ~해 드리다","ex":[["荷物(にもつ)を/お持(も)ち/します。","짐을 들어 드리겠습니다."],["会議室(かいぎしつ)まで/ご案内(あんない)/いたします。","회의실까지 안내해 드리겠습니다."]],"note":"주어는 나(우리 쪽). 손님의 행동에 쓰면 실례예요! いたす는 する보다 더 공손해요.","q":[{"s":"先生(せんせい)、その荷物(にもつ)、私(わたし)が ＿＿。","a":"お持(も)ちします","o":["お持(も)ちになります","持(も)たれます","お持(も)ちください"],"k":"선생님, 그 짐 제가 들어 드릴게요.","why":"내가 하는 행동 → 겸양어 お〜する."},{"s":"それでは、会場(かいじょう)まで ＿＿いたします。","a":"ご案内(あんない)","o":["お案内(あんない)","ご案内(あんない)に","案内(あんない)して"],"k":"그럼 회장까지 안내해 드리겠습니다.","why":"한자어 案内 → ご + 案内 + いたす."}]},{"id":"k06","topic":"경어","kind":"겸양어","title":"〜させていただく","form":"동사 사역형(させる)의 て형 + いただく","mean":"(허락을 받아) ~하겠습니다 / ~해도 될까요","ex":[["今日(きょう)は/これで/帰(かえ)らせて/いただきます。","오늘은 이만 돌아가겠습니다."],["明日(あした)/休(やす)ませて/いただけますか。","내일 쉬어도 될까요?"]],"note":"회사·아르바이트에서 허락을 구할 때 필수 표현. いただけますか로 물으면 아주 공손해요.","q":[{"s":"すみません、明日(あした) ＿＿いただけませんか。","a":"休(やす)ませて","o":["休(やす)んで","休(やす)まれて","お休(やす)みして"],"k":"죄송한데, 내일 쉬어도 될까요?","why":"休む의 사역 休ませる → 休ませていただく(허락을 받아 쉬다)."}]},{"id":"k07","topic":"경어","kind":"정중어","title":"ございます / でございます","form":"ある → ございます / です → でございます","mean":"있습니다 / ~입니다 (가장 공손한 말투)","ex":[["トイレは/2階(かい)に/ございます。","화장실은 2층에 있습니다."],["こちらが/新(あたら)しい/商品(しょうひん)で/ございます。","이쪽이 새 상품입니다."]],"note":"사람에게는 ございます가 아니라 いらっしゃいます(존경)/おります(겸양)를 써요.","q":[{"s":"お手洗(てあら)いは あちらに ＿＿。","a":"ございます","o":["いらっしゃいます","でございます","おられます"],"k":"화장실은 저쪽에 있습니다.","why":"물건·장소가 '있다'(ある) → ございます. いらっしゃる는 사람에게."}]},{"id":"k08","topic":"경어","kind":"정중어","title":"お / ご (미화어)","form":"お + 고유어(和語) / ご + 한자어(漢語)","mean":"말을 곱게 만드는 접두어","ex":[["お茶(ちゃ)を/どうぞ。","차 드세요."],["ご家族(かぞく)は/お元気(げんき)ですか。","가족분들은 잘 지내세요?"]],"note":"예외: お電話(でんわ)・お時間(じかん)・ご飯(はん)처럼 한자어인데 お를 쓰는 말도 있어요. 外来語(コーヒー 등)에는 보통 안 붙여요.","q":[{"s":"＿＿家族(かぞく)は お元気(げんき)ですか。","a":"ご","o":["お","おご"],"k":"가족분들은 잘 지내세요?","why":"家族는 한자어 → ご."},{"s":"あとで ＿＿電話(でんわ)します。","a":"お","o":["ご","おご"],"k":"나중에 전화 드리겠습니다.","why":"電話는 한자어지만 예외로 お電話."}]},{"id":"k09","topic":"경어","kind":"특별경어","title":"특별 존경어 · 겸양어","form":"공식(お〜になる/お〜する) 대신 아예 다른 단어를 쓰는 동사","mean":"자주 쓰는 동사는 통째로 외우기!","ex":[["先生(せんせい)は/明日(あした)/学校(がっこう)に/いらっしゃいます。","선생님은 내일 학교에 오십니다."],["明日(あした)/私(わたし)が/会社(かいしゃ)に/参(まい)ります。","내일 제가 회사로 가겠습니다."],["何(なに)を/召(め)し上(あ)がりますか。","무엇을 드시겠어요?"],["私(わたし)は/田中(たなか)と/申(もう)します。","저는 다나카라고 합니다."]],"note":"아래 표의 존경어 ↔ 겸양어를 짝으로 외우세요. 경어 바꾸기 퀴즈로 연습할 수 있어요.","q":[{"s":"先生(せんせい)、この写真(しゃしん)を ＿＿か。","a":"ご覧(らん)になりました","o":["拝見(はいけん)しました","ご覧(らん)しました","お見(み)になりました"],"k":"선생님, 이 사진을 보셨습니까?","why":"선생님이 보다 → 존경어 ご覧になる. 拝見する는 내가 볼 때 const RJ2=_t("きゃkya,きゅkyu,きょkyo,しゃsha,しゅshu,しょsho,ちゃcha,ちゅchu,ちょcho,にゃnya,にゅnyu,にょnyo,ひゃhya,ひゅhyu,ひょhyo,みゃmya,みゅmyu,みょmyo,りゃrya,りゅryu,りょryo,ぎゃgya,ぎゅgyu,ぎょgyo,じゃja,じゅju,じょjo,ぢゃja,ぢゅju,ぢょjo,びゃbya,びゅbyu,びょbyo,ぴゃpya,ぴゅpyu,ぴょpyo",2);
const KUN1=_t("しsi,ちti,つtu,ふhu,じzi,ぢdi,づdu",1);
const KUN2=_t("しゃsya,しゅsyu,しょsyo,ちゃtya,ちゅtyu,ちょtyo,じゃzya,じゅzyu,じょzyo",2);
function kanaToRomaji(str,kunrei){
  let s="";
  for(const ch of str){const c=ch.codePointAt(0);
    s+=(c>=0x30A1&&c<=0x30F6)?String.fromCodePoint(c-0x60):ch;}
  let out="",i=0;
  while(i<s.length){
    const two=s.substr(i,2);
    if(s[i]==="っ"){const nx=RJ2[s.substr(i+1,2)]||RJ1[s[i+1]]||"";if(nx)out+=nx[0];i++;continue;}
    if(RJ2[two]){out+=(kunrei&&KUN2[two])||RJ2[two];i+=2;continue;}
    if(RJ1[s[i]]){out+=(kunrei&&KUN1[s[i]])||RJ1[s[i]];i++;continue;}
    if(s[i]!=="ー"&&s[i]!==".")out+=s[i];
    i++;
  }
  return out;
}

/* ══════════ 한자 ══════════ */
const LEVELS=[["ALL","전체"],["N5","N5"],["N4","N4"],["N3","N3"],["N2","N2"],["N1","N1(일부)"]];
let kLevel="ALL", kSt="all", kView=[], kBackToVocab=false;
let FAV=store.get("kanji_fav"), LEARNED=store.get("kanji_learned");

function ruby(b,r){return r?`<ruby>${b}<rt>${r}</rt></ruby>`:b;}
function wordHTML(w){return `<span class="jp">${ruby(w[0],w[1])}${ruby(w[2],w[3])}</span> <span class="ko">${w[4]}</span>`;}
function shortMeaning(k){return k.ko||(k.en[0]||"");}
function hex(ch){return ch.codePointAt(0).toString(16).padStart(5,"0");}
function kInLevel(k){return kLevel==="ALL"||k.level===kLevel;}
function kStOK(k){return kSt==="all"||(kSt==="fav"&&FAV.has(k.char))||(kSt==="unlearned"&&!LEARNED.has(k.char));}
function kRomaji(k){
  if(k._rj===undefined){const all=k.on.concat(k.kun).map(r=>r.split(".").join("")).join(" ");
    k._rj=kanaToRomaji(all,false)+" "+kanaToRomaji(all,true);}
  return k._rj;
}

$("#kLv").innerHTML=LEVELS.map(([v,l])=>`<button class="chip ${v==='ALL'?'active':''}" data-lv="${v}">${l}</button>`).join("");
$("#kSt").innerHTML=STS.map(([v,l])=>`<button class="chip ${v==='all'?'active':''}" data-kst="${v}">${l}</button>`).join("");
document.querySelectorAll("[data-lv]").forEach(c=>c.onclick=()=>{kLevel=c.dataset.lv;
  document.querySelectorAll("[data-lv]").forEach(x=>x.classList.toggle("active",x===c));kRenderList($("#kSearch").value);});
document.querySelectorAll("[data-kst]").forEach(c=>c.onclick=()=>{kSt=c.dataset.kst;
  document.querySelectorAll("[data-kst]").forEach(x=>x.classList.toggle("active",x===c));kRenderList($("#kSearch").value);});

function kFiltered(f){f=f.trim().toLowerCase();
  return KANJI.filter(k=>kInLevel(k)&&kStOK(k)&&(!f||k.char.includes(f)||k.ko.toLowerCase().includes(f)
    ||k.on.join("").toLowerCase().includes(f)||k.kun.join("").toLowerCase().includes(f)
    ||k.en.join(" ").toLowerCase().includes(f)||kRomaji(k).includes(f)));}
function kProgress(){const pool=KANJI.filter(kInLevel);const done=pool.filter(k=>LEARNED.has(k.char)).length;
  const pct=pool.length?Math.round(done/pool.length*100):0;
  $("#kProg").innerHTML=`암기 진도 (${kLevel==="ALL"?"전체":kLevel}) · ${done} / ${pool.length} (${pct}%)<div class="bar"><i style="width:${pct}%"></i></div>`;}
function kRenderList(f=""){const list=kFiltered(f);kView=list;kProgress();$("#kCount").textContent=`${list.length}자`;
  $("#kGrid").innerHTML=list.length?list.map(k=>`
    <div class="cell ${LEARNED.has(k.char)?'learned':''}" onclick="kShow('${k.char}')">
      <span class="lv">${k.level}</span>
      <span class="fav ${FAV.has(k.char)?'on':''}" onclick="event.stopPropagation();kFavCell('${k.char}',this)">★</span>
      <div class="k">${k.char}</div><div class="m">${shortMeaning(k)}</div><span class="chk">✓</span>
    </div>`).join(""):`<p class="empty">조건에 맞는 한자가 없습니다.</p>`;}
function kFavCell(ch,el){toggleSet(FAV,"kanji_fav",ch);el.classList.toggle("on",FAV.has(ch));if(kSt==="fav")kRenderList($("#kSearch").value);}

function wordsBlock(g){return g.map(x=>`<li><span class="mark">${x.r}</span>${x.words.map(wordHTML).join(' , ')}</li>`).join("");}
function kShow(char){
  const k=KANJI.find(x=>x.char===char);if(!k)return;
  const rich=!!k.shape;
  if(!kView.length)kView=KANJI.filter(kInLevel);
  const idx=kView.findIndex(x=>x.char===char);
  const prev=idx>0?kView[idx-1].char:null, next=idx>=0&&idx<kView.length-1?kView[idx+1].char:null;
  kSetView("detail");
  $("#k-detail").innerHTML=`
    ${kBackToVocab?`<div class="backbar" onclick="kBackVocab()">← ${kBackToVocab==="grammar"?"문법으로":"단어장으로"} 돌아가기</div>`:""}
    <div class="nav">
      <a onclick="kSetView('list')">← 목록</a>
      <span>
        <a class="${prev?'':'dim'}" ${prev?`onclick="kShow('${prev}')"`:''}>◀ 이전</a>&nbsp;&nbsp;
        <a class="${next?'':'dim'}" ${next?`onclick="kShow('${next}')"`:''}>다음 ▶</a>
      </span>
    </div>
    <div class="title">「${k.char}」 <button class="spk" onclick="speak('${k.char}')">🔊</button></div>
    <div class="stroke" id="kStroke"><div class="bigk">${k.char}</div></div>
    <div class="meta">JLPT ${k.level} · ${k.strokes}획</div>
    <div class="actions">
      <button class="btn fav ${FAV.has(char)?'on':''}" id="kBFav">★ 즐겨찾기</button>
      <button class="btn chk ${LEARNED.has(char)?'on':''}" id="kBChk">✓ 외웠어요</button>
    </div>
    <div class="sec"><h2>1. 기본 정보</h2><ul>
      <li><span class="mark">의미</span><b>${k.ko}</b> <span class="en">${k.en.join(", ")}</span></li>
      <li><span class="mark">음독</span><span class="jp">${k.on.join("、")||"—"}</span>${k.on.length?`<button class="spk" onclick="speak('${k.on[0]}')">🔊</button>`:""}</li>
      <li><span class="mark">훈독</span><span class="jp">${k.kun.join("、")||"—"}</span>${k.kun.length?`<button class="spk" onclick="speak('${(k.kun[0]||"").split(".")[0]}')">🔊</button>`:""}</li>
    </ul></div>
    <div class="sec"><h2>2. 한자 모양 해설</h2>
      ${rich?k.shape.map(s=>`<p class="note">${s}</p>`).join(""):`<div class="todo">이 한자의 어원 해설은 준비 중입니다.</div>`}
      ${k.tip?`<div class="tip">💡 <b>암기 꿀팁</b> · ${k.tip}</div>`:""}</div>
    <div class="sec"><h2>3. 음독 상세</h2>
      <p class="note">음독은 <span class="jp">${k.on.join("、")||"—"}</span>입니다. ${rich?(k.onNote||""):""}</p>
      ${rich&&k.onWords.length?`<div class="sub">음독 대표단어</div><ul>${wordsBlock(k.onWords)}</ul>`:`<div class="todo">대표단어는 준비 중입니다.</div>`}</div>
    <div class="sec"><h2>4. 훈독 상세</h2>
      <p class="note">훈독은 <span class="jp">${k.kun.join("、")||"—"}</span>입니다. ${rich?(k.kunNote||""):""}</p>
      ${rich&&k.kunWords.length?`<div class="sub">훈독 대표단어</div><ul>${wordsBlock(k.kunWords)}</ul>`:`<div class="todo">대표단어는 준비 중입니다.</div>`}</div>`;
  $("#kBFav").onclick=e=>{toggleSet(FAV,"kanji_fav",char);e.target.classList.toggle("on",FAV.has(char));};
  $("#kBChk").onclick=e=>{toggleSet(LEARNED,"kanji_learned",char);e.target.classList.toggle("on",LEARNED.has(char));};
  kLoadStroke(char);window.scrollTo(0,0);
}
function kLoadStroke(char){fetch(`https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex(char)}.svg`)
  .then(r=>r.ok?r.text():Promise.reject()).then(svg=>{const el=$("#kStroke");if(el)el.innerHTML=svg;}).catch(()=>{});}
function kBackVocab(){const m=kBackToVocab;kBackToVocab=false;setMode(m==="grammar"?"grammar":"vocab");}

/* 한자 카드 */
let kfPool=[],kfIdx=0;
function kStartCard(){kfPool=KANJI.filter(k=>kInLevel(k)&&kStOK(k)).sort(()=>Math.random()-0.5);kfIdx=0;kRenderCard();}
function fcRead(label,readings,groups,speakTxt,cls){
  const rd=readings.length?readings.join("、"):"—";
  const exs=[];
  for(const g of (groups||[])){ for(const w of (g.words||[])){ if(exs.length<2) exs.push(w); } if(exs.length>=2) break; }
  return `<div class="fc-read"><span class="fc-tag ${cls}">${label}</span> <span class="jp rdl">${rd}</span>`
    +(readings.length&&speakTxt?` <button class="spk" onclick="event.stopPropagation();speak('${speakTxt}')">🔊</button>`:"")
    +exs.map(w=>`<div class="fc-ex">${wordHTML(w)}</div>`).join("")+`</div>`;
}
function kRenderCard(){
  const head=`<div class="filters c3 d6">${LEVELS.map(([v,l])=>`<button class="chip ${v===kLevel?'active':''}" onclick="kCardLv('${v}')">${l}</button>`).join("")}</div>
    <div class="filters c3">${STS.map(([v,l])=>`<button class="chip ${v===kSt?'active':''}" onclick="kCardSt('${v}')">${l}</button>`).join("")}</div>`;
  if(!kfPool.length){$("#k-card").innerHTML=head+`<p class="empty">해당 조건의 한자가 없습니다.</p>`;return;}
  if(kfIdx>=kfPool.length){$("#k-card").innerHTML=head+`<p class="empty">🎉 ${kfPool.length}장 학습 완료!<br><br><button class="chip" onclick="kStartCard()">다시 섞기</button></p>`;return;}
  const k=kfPool[kfIdx];
  $("#k-card").innerHTML=head+`
    <div class="navline"><button onclick="kCardMove(-1)" ${kfIdx===0?'disabled':''}>◀ 이전</button>
      <span class="count" style="margin:0">${kfIdx+1} / ${kfPool.length}</span>
      <button onclick="kCardMove(1)">다음 ▶</button></div>
    <div class="fc"><div class="fcard" onclick="this.classList.toggle('flip')">
      <div class="face f"><div class="big">${k.char}</div><div class="fhint">탭하면 뜻 보기</div></div>
      <div class="face b">
        <div class="fc-label">뜻</div>
        <p class="ko">${k.ko}</p>
        <p class="en">${k.en.join(", ")}</p>
        ${fcRead("음독",k.on,k.onWords,k.on[0]||k.char,"on")}
        ${fcRead("훈독",k.kun,k.kunWords,(k.kun[0]||"").split(".")[0],"kun")}
      </div>
    </div></div>
    <div class="fcbtns">
      <button class="dunno" onclick="kCardNext(false)">✗ 모름</button>
      <button class="know" onclick="kCardNext(true)">✓ 외움</button>
    </div>`;
}
function kCardNext(known){const k=kfPool[kfIdx];if(known){LEARNED.add(k.char);store.set("kanji_learned",LEARNED);}kfIdx++;kRenderCard();}
function kCardMove(d){kfIdx=Math.max(0,Math.min(kfPool.length,kfIdx+d));kRenderCard();}
function kCardLv(v){kLevel=v;kStartCard();}
function kCardSt(v){kSt=v;kStartCard();}

/* 한자 퀴즈 */
let kScore=0,kTotal=0;
function kQuizHead(){return `<div class="filters c3 d6">${LEVELS.map(([v,l])=>`<button class="chip ${v===kLevel?'active':''}" onclick="kQuizLv('${v}')">${l}</button>`).join("")}</div>
  <div class="filters c3">${STS.map(([v,l])=>`<button class="chip ${v===kSt?'active':''}" onclick="kQuizSt('${v}')">${l}</button>`).join("")}</div>`;}
function kNewQuiz(){const pool=KANJI.filter(k=>kInLevel(k)&&kStOK(k));
  if(pool.length<1){$("#k-quiz").innerHTML=kQuizHead()+`<p class="empty">해당 조건의 한자가 없습니다.</p>`;return;}
  const correct=pool[Math.floor(Math.random()*pool.length)];const ask=Math.random()<0.5;
  const label=k=>ask?shortMeaning(k):`<span class="jp">${k.on.concat(k.kun).join("、")||"—"}</span>`;
  // 오답 보기: 같은 등급 한자에서 우선 (보기 글자가 같으면 제외)
  const seen=new Set([label(correct)]),others=[];
  for(const pool2 of [KANJI.filter(k=>k.level===correct.level),KANJI])
    for(const k of pool2.slice().sort(()=>Math.random()-0.5)){
      if(others.length>=3)break;if(k===correct||seen.has(label(k)))continue;seen.add(label(k));others.push(k);}
  const opts=[correct,...others].sort(()=>Math.random()-0.5);
  $("#k-quiz").innerHTML=kQuizHead()+`<div class="quiz"><div class="prompt">${ask?"이 한자의 뜻은?":"이 한자의 읽기는?"}</div>
    <div class="q">${correct.char}</div>
    <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===correct?1:0}" onclick="kAnswer(this)">${label(o)}</div>`).join("")}</div>
    <div class="score" id="kScoreBox">맞힘 ${kScore} / 푼 문제 ${kTotal}</div></div>`;}
function kQuizLv(v){kLevel=v;kNewQuiz();}
function kQuizSt(v){kSt=v;kNewQuiz();}
function kAnswer(el){if(el.dataset.done)return;kTotal++;const ok=el.dataset.c==="1";
  document.querySelectorAll("#k-quiz .opt").forEach(o=>{o.dataset.done=1;if(o.dataset.c==="1")o.classList.add("ok");});
  if(ok)kScore++;else el.classList.add("no");
  $("#kScoreBox").textContent=`맞힘 ${kScore} / 푼 문제 ${kTotal}`;setTimeout(kNewQuiz,950);}

function kSetView(v){
  ["list","detail","card","quiz"].forEach(x=>$("#k-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("[data-kv]").forEach(t=>t.classList.toggle("active",t.dataset.kv===v||(v==="detail"&&t.dataset.kv==="list")));
  if(v==="list")kRenderList($("#kSearch").value);
  if(v==="card")kStartCard();
  if(v==="quiz")kNewQuiz();
}
document.querySelectorAll("[data-kv]").forEach(t=>t.onclick=()=>{kBackToVocab=false;kSetView(t.dataset.kv);});
$("#kSearch").addEventListener("input",e=>kRenderList(e.target.value));
document.addEventListener("keydown",e=>{
  if(mode!=="kanji"||$("#k-detail").classList.contains("hide"))return;
  const a=[...document.querySelectorAll("#k-detail .nav a")];
  if(e.key==="ArrowLeft"&&a[1]&&!a[1].classList.contains("dim"))a[1].click();
  if(e.key==="ArrowRight"&&a[2]&&!a[2].classList.contains("dim"))a[2].click();
});

/* ══════════ 단어장 ══════════ */
let vType="ALL", vSt="all", vCh="ALL";
let VFAV=store.get("vocab_fav"), VLEARNED=store.get("vocab_learned");
const vid=w=>w.w+"|"+w.r;
const TYPES=["ALL",...[...new Set(WORDS.map(w=>w.t))]];
const chNum=c=>parseInt(String(c).replace(/\D/g,""))||0;
const CHS=[...new Set(WORDS.map(w=>w.ch))].sort((a,b)=>chNum(a)-chNum(b));
const chLabel=c=>c==="ALL"?"전체":"챕터 "+(chNum(c)||c);
let vCur="list";
try{const s=localStorage.getItem("vocab_ch");vCh=(s&&(s==="ALL"||CHS.includes(s)))?s:CHS[0];}catch(e){vCh=CHS[0];}

function vRomaji(w){if(w._rj===undefined)w._rj=kanaToRomaji(w.r,false)+" "+kanaToRomaji(w.r,true);return w._rj;}
function linkify(s){
  return [...s].map(ch=>KSET.has(ch)
    ? `<span class="kl" onclick="event.stopPropagation();openKanji('${ch}')" title="${ch} 한자 정보">${ch}</span>` : ch).join("");
}
function rubyJP(w){return w.w===w.r?w.w:`<ruby>${linkify(w.w)}<rt>${w.r}</rt></ruby>`;}
function openKanji(ch){ if(!KSET.has(ch))return; kBackToVocab=mode==="grammar"?"grammar":"vocab"; setMode("kanji"); kShow(ch); }
/* 단어 속 한자 풀이: 食事 → [食 먹을 식] [事 일 사] (누르면 한자 상세) */
const KMAP=Object.fromEntries(KANJI.map(k=>[k.char,k]));
function kBreak(word){const cs=[...new Set([...word].filter(ch=>KSET.has(ch)))];
  if(!cs.length)return "";
  return `<div class="kbrk">${cs.map(ch=>`<span class="kb" onclick="event.stopPropagation();openKanji('${ch}')"><b>${ch}</b>${shortMeaning(KMAP[ch])}</span>`).join("")}</div>`;}

/* 챕터 선택 바: 목록·카드·퀴즈 공통 */
function renderChBar(){
  $("#vChBar").innerHTML=[...CHS,"ALL"].map(c=>{const n=c==="ALL"?WORDS.length:WORDS.filter(w=>w.ch===c).length;
    return `<button class="chb ${c===vCh?'active':''}" onclick="vSelCh('${c}')">${chLabel(c)}<span class="n">${n}단어</span></button>`;}).join("");
}
function vSelCh(c){vCh=c;try{localStorage.setItem("vocab_ch",c);}catch(e){}renderChBar();vSetView(vCur);}
$("#vTy").innerHTML=TYPES.map(t=>`<button class="chip ${t==='ALL'?'active':''}" data-vty="${t}">${t==='ALL'?'전체':t}</button>`).join("");
$("#vSt").innerHTML=STS.map(([v,l])=>`<button class="chip ${v==='all'?'active':''}" data-vst="${v}">${l}</button>`).join("");
document.querySelectorAll("[data-vty]").forEach(c=>c.onclick=()=>{vType=c.dataset.vty;
  document.querySelectorAll("[data-vty]").forEach(x=>x.classList.toggle("active",x===c));vRenderList($("#vSearch").value);});
document.querySelectorAll("[data-vst]").forEach(c=>c.onclick=()=>{vSt=c.dataset.vst;
  document.querySelectorAll("[data-vst]").forEach(x=>x.classList.toggle("active",x===c));vRenderList($("#vSearch").value);});

function vIn(w){return (vType==="ALL"||w.t===vType)&&(vCh==="ALL"||w.ch===vCh);}
function vStOK(w){const id=vid(w);return vSt==="all"||(vSt==="fav"&&VFAV.has(id))||(vSt==="unlearned"&&!VLEARNED.has(id));}
function vPool(){return WORDS.filter(w=>vIn(w)&&vStOK(w));}
function vFiltered(f){f=f.trim().toLowerCase();
  return WORDS.filter(w=>vIn(w)&&vStOK(w)&&(!f||w.w.includes(f)||w.r.includes(f)
    ||w.ko.toLowerCase().includes(f)||vRomaji(w).includes(f)));}
function vProgress(){const p=WORDS.filter(vIn);const done=p.filter(w=>VLEARNED.has(vid(w))).length;
  const pct=p.length?Math.round(done/p.length*100):0;
  $("#vProg").innerHTML=`암기 진도 (${chLabel(vCh)} · ${vType==="ALL"?"모든 품사":vType}) · ${done} / ${p.length} (${pct}%)<div class="bar"><i style="width:${pct}%"></i></div>`;}
function vRenderList(f=""){const L=vFiltered(f);vProgress();$("#vCount").textContent=`${L.length}개`;
  $("#vList").innerHTML=L.length?L.map(w=>{const id=vid(w);return `
    <div class="row ${VLEARNED.has(id)?'learned':''}">
      <span class="jp">${rubyJP(w)}</span>
      <button class="spk" onclick="speak('${w.r}')">🔊</button>
      <span class="mean">${w.ko}<span class="tagc">${w.t} · ${w.ch}</span></span>
      <span>
        <button class="mini ${VFAV.has(id)?'on':''}" onclick="vFav('${id}',this)">${VFAV.has(id)?'★':'☆'}</button>
        <button class="mini ${VLEARNED.has(id)?'on':''}" onclick="vLearn('${id}',this)">${VLEARNED.has(id)?'✅':'⬜'}</button>
      </span>
    </div>`}).join(""):`<p class="empty">조건에 맞는 단어가 없습니다.</p>`;}
function vFav(id,el){toggleSet(VFAV,"vocab_fav",id);el.textContent=VFAV.has(id)?'★':'☆';el.classList.toggle("on",VFAV.has(id));if(vSt==="fav")vRenderList($("#vSearch").value);}

/* 단어 퀴즈 — 4가지 방식 */
const QMODES=[["mc","객관식"],["rev","뜻 보고 단어"],["type","읽기 직접 쓰기"],["listen","듣고 고르기"]];
let vScore=0,vTotal=0,vQMode="mc",vOnlyWrong=false,vQ=null;
let VWRONG=store.get("vocab_wrong");
try{const m=localStorage.getItem("vocab_qmode");if(QMODES.some(q=>q[0]===m))vQMode=m;}catch(e){}
function vQuizHead(){return `<div class="filters c2 d4">${QMODES.map(([v,l])=>`<button class="chip ${v===vQMode?'active':''}" onclick="vQuizMode('${v}')">${l}</button>`).join("")}</div>
  <div class="filters c4 d8">${TYPES.map(t=>`<button class="chip ${t===vType?'active':''}" onclick="vQuizTy('${t}')">${t==='ALL'?'전체':t}</button>`).join("")}</div>
  <div class="filters c2 d4">${STS.map(([v,l])=>`<button class="chip ${v===vSt&&!vOnlyWrong?'active':''}" onclick="vQuizSt('${v}')">${l}</button>`).join("")}
    <button class="chip ${vOnlyWrong?'active':''}" onclick="vQuizWrong()">✗ 틀린 단어 ${WORDS.filter(w=>vIn(w)&&VWRONG.has(vid(w))).length}</button></div>`;}
function vQuizPool(){return vOnlyWrong?WORDS.filter(w=>vIn(w)&&VWRONG.has(vid(w))):vPool();}
function vNewQuiz(){const P=vQuizPool();
  if(vOnlyWrong&&!P.length){$("#v-quiz").innerHTML=vQuizHead()+`<p class="empty">🎉 틀린 단어가 없어요! (퀴즈에서 틀리면 여기에 모이고, 맞히면 빠져요)</p>`;return;}
  if(!vOnlyWrong&&P.length<4){$("#v-quiz").innerHTML=vQuizHead()+`<p class="empty">단어가 4개 이상이어야 퀴즈를 낼 수 있어요.</p>`;return;}
  let c=P[Math.floor(Math.random()*P.length)];
  if(vOnlyWrong&&vQ&&P.length>1&&c===vQ.c)c=P.find(w=>w!==vQ.c);
  const m=vQMode; let ask="";
  let body="";
  if(m==="type"){
    // 한자 단어는 표기를 보고 읽기를, 가나 단어는 뜻을 보고 단어를 쓴다
    const kana=c.w===c.r;
    ask=kana?"이 뜻의 단어를 가나(또는 로마자)로 쓰세요":"읽기를 히라가나(또는 로마자)로 쓰세요";
    body=`<div class="${kana?'qko':'qw'}">${kana?c.ko:c.w}</div>
      <form class="tin" onsubmit="event.preventDefault();vTyped()">
        <input id="vTypeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${kana?'예: ちっとも / chittomo':'예: じゅんび / junbi'}">
        <button class="chip active" type="submit">확인</button></form>
      <button class="linkbtn" onclick="vTyped(true)">모르겠어요 (정답 보기)</button>`;
  }else{
    let key,label,prompt,show;
    if(m==="rev"){key=w=>w.w;label=w=>`<span class="jp">${w.w}</span>`;prompt="이 뜻의 단어는?";show=`<div class="qko">${c.ko}</div>`;}
    else if(m==="listen"){key=w=>w.ko;label=w=>w.ko;prompt="잘 듣고 뜻을 고르세요";
      show=`<button class="spk big" onclick="speak('${c.r}')">🔊 다시 듣기</button>`;}
    else{const askM=c.w===c.r||Math.random()<0.5;key=askM?(w=>w.ko):(w=>w.r);
      label=askM?(w=>w.ko):(w=>`<span class="jp">${w.r}</span>`);prompt=askM?"이 단어의 뜻은?":"이 단어의 읽기는?";show=`<div class="qw">${c.w}</div>`;}
    const opts=[c,...vDistractors(c,key,m!=="mc"||key(c)===c.ko)].sort(()=>Math.random()-0.5);
    ask=prompt;
    body=show+`<div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===c?1:0}" onclick="vAnswer(this)">${label(o)}</div>`).join("")}</div>`;
  }
  vQ={c};
  $("#v-quiz").innerHTML=vQuizHead()+`<div class="quiz">
    <div class="prompt">${ask}</div>${body}
    <div id="vFeed"></div>
    <div class="score" id="vScoreBox">맞힘 ${vScore} / 푼 문제 ${vTotal}</div></div>`;
  if(m==="listen")speak(c.r);
  if(m==="type")setTimeout(()=>{const i=$("#vTypeIn");if(i)i.focus();},50);
}
/* 오답 보기: 같은 품사에서만 뽑아 품사로 답이 티 나지 않게.
   읽기가 보기인 문제는 글자 수·첫 글자·겹치는 가나가 비슷한 것을 우선 → 헷갈리는 보기 */
function vDistractors(c,key,randomPick){
  const used=new Set([key(c)]);
  const tiers=[w=>w.t===c.t&&(vCh==="ALL"||w.ch===vCh), w=>w.t===c.t, ()=>true];
  const sim=w=>{let sc=0;const a=[...c.r],b=[...w.r];
    sc-=Math.abs(a.length-b.length)*1.5; if(a[0]===b[0])sc+=2; if(a.at(-1)===b.at(-1))sc+=1;
    b.forEach(ch=>{if(a.includes(ch))sc+=1;}); return sc+Math.random()*2;};
  const out=[];
  for(const t of tiers){
    let cand=WORDS.filter(w=>w!==c&&t(w)&&!used.has(key(w)));
    if(randomPick)cand.sort(()=>Math.random()-0.5);
    else{cand.sort((x,y)=>sim(y)-sim(x));cand=cand.slice(0,8).sort(()=>Math.random()-0.5);}
    for(const w of cand){if(out.length>=3)break;if(!used.has(key(w))){used.add(key(w));out.push(w);}}
    if(out.length>=3)break;
  }
  return out;
}
/* 채점 후: 맞히면 잠깐 뒤 다음 문제, 틀리면 정답 풀이를 보여주고 [다음] 버튼 */
function vResult(ok){
  const c=vQ.c,id=vid(c);vTotal++;
  if(ok){vScore++;if(VWRONG.delete(id))store.set("vocab_wrong",VWRONG);}
  else{VWRONG.add(id);store.set("vocab_wrong",VWRONG);}
  $("#vScoreBox").textContent=`맞힘 ${vScore} / 푼 문제 ${vTotal}`;
  $("#vFeed").innerHTML=`<div class="feed ${ok?'good':'bad'}">
      <div class="fh">${ok?'⭕ 정답!':'❌ 아쉬워요'}</div>
      <div class="fw">${rubyJP(c)} <button class="spk" onclick="speak('${c.r}')">🔊</button></div>
      <div class="fk">${c.ko}</div>${kBreak(c.w)}
      ${ok?'':`<button class="chip active nextb" onclick="vNewQuiz()">다음 문제 ▶</button>`}</div>`;
  if(ok)setTimeout(()=>{if(vQ&&vQ.c===c&&vCur==="quiz")vNewQuiz();},1300);
  else{const b=$("#vFeed .nextb");if(b)b.focus();}
}
function vAnswer(el){if(el.dataset.done)return;const ok=el.dataset.c==="1";
  document.querySelectorAll("#v-quiz .opt").forEach(o=>{o.dataset.done=1;if(o.dataset.c==="1")o.classList.add("ok");});
  if(!ok)el.classList.add("no");vResult(ok);}
/* 주관식: 히라가나·가타카나·로마자 모두 허용, 장음 표기 차이(ou/oo/uu 등)와 な형용사의 だ 생략도 인정 */
function hira(s){return [...s].map(ch=>{const c=ch.codePointAt(0);return (c>=0x30A1&&c<=0x30F6)?String.fromCodePoint(c-0x60):ch;}).join("");}
function rjNorm(s){return s.toLowerCase().replace(/[^a-z]/g,"").replace(/jy/g,"j").replace(/m(?=[bmp])/g,"n").replace(/([aiueo])\1/g,"$1").replace(/ou/g,"o").replace(/ei/g,"e");}
function vTyped(giveUp){
  if(!vQ||$("#vTypeIn").disabled)return;
  const c=vQ.c,raw=$("#vTypeIn").value.trim().replace(/\s/g,"");
  if(!giveUp&&!raw)return;
  const ans=c.w===c.r?c.w:c.r, alt=ans.replace(/だ$/,"");
  let ok=false;
  if(!giveUp){
    const h=hira(raw);
    if(/[a-zA-Z]/.test(raw)){const n=rjNorm(raw);ok=[ans,alt].some(a=>rjNorm(kanaToRomaji(a,false))===n||rjNorm(kanaToRomaji(a,true))===n);}
    else ok=[ans,alt].some(a=>hira(a).replace(/ー/g,"")===h.replace(/ー/g,""));
  }
  $("#vTypeIn").disabled=true;$("#vTypeIn").classList.add(ok?"ok":"no");
  vResult(ok);
}
function vQuizMode(m){vQMode=m;try{localStorage.setItem("vocab_qmode",m);}catch(e){}vNewQuiz();}
function vQuizTy(t){vType=t;vNewQuiz();}

function vSetView(v){vCur=v;

}

/* 표기: 漢字(かな) → 후리가나, '/' 는 배열 퀴즈용 경계라 지움, ＿＿ → 빈칸 */
function jr(s){
  return s.replace(/\//g,"")
    .replace(/([一-鿿々]+)\(([ぁ-ゟー]+)\)/g,(m,b,rd)=>`<ruby>${linkify(b)}<rt>${rd}</rt></ruby>`)

  return `<div class="filters c${M.length}">${M.map(([v,l])=>`<button class="chip ${v===gQMode?'active':''}" onclick="gQuizMode('${v}')">${l}</button>`).join("")}</div>`;}
function gQuizMode(m){gQMode=m;try{localStorage.setItem("grammar_qmode",m);}catch(e){}gNewQuiz();}
function gPick(P,key){if(P.length>1&&gQ&&gQ.key!==undefined){const Q=P.filter(x=>key(x)!==gQ.key);if(Q.length)P=Q;}return P[Math.floor(Math.random()*P.length)];}
function gNewQuiz(){
  const head=gQuizHead();let body="";
  if(gQMode==="blank"){
    const P=gItems().flatMap(i=>(i.q||[]).map(q=>({...q,item:i})));
    if(!P.length){$("#g-quiz").innerHTML=head+`<p class="empty">문제가 없어요.</p>`;return;}
    const q=gPick(P,x=>x.s);gQ={key:q.s,q};
    const opts=shuffle([q.a,...q.o]);
    body=`<div class="prompt">빈칸에 들어갈 말은?</div><div class="gq">${jr(q.s)}</div><div class="gqk">${q.k}</div>
      <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===q.a?1:0}" onclick="gAnswer(this)"><span class="jp">${jr(o)}</span></div>`).join("")}</div>`;
  }else if(gQMode==="conv"){
    const T=gTable(),cells=[];
    T.forEach((r,n)=>[1,2].forEach(c=>{if(r[c]!=="—")cells.push({n,c});}));
    const t=gPick(cells,x=>x.n+":"+x.c);gQ={key:t.n+":"+t.c};
    const row=T[t.n],ans=row[t.c],parts=new Set(ans.split("・").map(jplain));
    const clash=x=>x==="—"||x===ans||x.split("・").some(p=>parts.has(jplain(p)));
    const opp=row[3-t.c];
    const others=shuffle(T.filter((r,n)=>n!==t.n).map(r=>r[t.c]).filter(x=>!clash(x)));
    const D=[...(clash(opp)?[]:[opp]),...others].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
    const opts=shuffle([ans,...D]);gQ.q={a:ans,why:`${jplain(row[0])} → 존경어 ${jplain(row[1])} / 겸양어 ${jplain(row[2])}`};
    body=`<div class="prompt">다음 동사의 <b>${t.c===1?"존경어 ↑":"겸양어 ↓"}</b>는?</div>
      <div class="qw">${jr(row[0])}</div><div class="gqk">${row[3]} · ${t.c===1?"상대(윗사람)가 할 때":"내가 할 때"}</div>
      <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===ans?1:0}" onclick="gAnswer(this)"><span class="jp">${o.split("・").map(jr).join("・")}</span></div>`).join("")}</div>`;
  }else{
    const S=gItems().flatMap(i=>i.ex.map(([jp,ko])=>({jp,ko,item:i}))).filter(x=>x.jp.split("/").length>=3);
    if(!S.length){$("#g-quiz").innerHTML=head+`<p class="empty">문제가 없어요.</p>`;return;}
    const x=gPick(S,y=>y.jp);
    const parts=x.jp.split("/");
    const pool=shuffle(G.items.flatMap(i=>i.ex.flatMap(e=>e[0].split("/"))).filter(c=>!parts.some(p=>jplain(p)===jplain(c))));
    const chunks=shuffle([...parts.map(t=>({t,ok:1})),...(pool[0]?[{t:pool[0],ok:0}]:[])]);
    gQ={key:x.jp,x,chunks,pick:[]};
    body=`<div class="prompt">한국어 뜻에 맞게 순서대로 눌러 문장을 만드세요</div>
      <div class="qko" style="font-size:20px">${x.ko}</div>
      <div class="ord-ans" id="gOrdAns"></div>
      <div class="ord-bank">${chunks.map((c,n)=>`<button class="ord-c" id="gOc${n}" onclick="gOrdPick(${n})">${jr(c.t)}</button>`).join("")}</div>
      <div class="ord-go"><button class="chip active" style="width:100%;min-height:44px;font-size:15px" onclick="gOrdCheck()">확인</button></div>`;
  }
  $("#g-quiz").innerHTML=head+`<div class="quiz">${body}<div id="gFeed"></div>
    <div class="score" id="gScoreBox">맞힘 ${gScore} / 푼 문제 ${gTotal}</div></div>`;
}
function gOrdPick(n){if(gQ.done)return;gQ.pick.push(n);gOrdDraw();}
function gOrdUnpick(k){if(gQ.done)return;gQ.pick.splice(k,1);gOrdDraw();}
function gOrdDraw(){
  gQ.chunks.forEach((c,n)=>$("#gOc"+n).classList.toggle("used",gQ.pick.includes(n)));
  $("#gOrdAns").innerHTML=gQ.pick.map((n,k)=>`<button class="ord-c" onclick="gOrdUnpick(${k})">${jr(gQ.chunks[n].t)}</button>`).join("");
}
function gOrdCheck(){if(gQ.done||!gQ.pick.length)return;
  const made=gQ.pick.map(n=>jplain(gQ.chunks[n].t)).join(""),ok=made===jplain(gQ.x.jp);
  gQ.done=1;gResult(ok,`<div class="gq" style="font-size:19px">${jr(gQ.x.jp)} ${say(gQ.x.jp)}</div><div class="gqk" style="margin:0">${gQ.x.ko}</div>`);
}
function gAnswer(el){if(el.dataset.done)return;const ok=el.dataset.c==="1";
  document.querySelectorAll("#g-quiz .opt").forEach(o=>{o.dataset.done=1;if(o.dataset.c==="1")o.classList.add("ok");});
  if(!ok)el.classList.add("no");
  const q=gQ.q;let ex="";
  if(gQMode==="blank"){const full=q.s.replace("＿＿","⟦"+q.a+"⟧");
    ex=`<div class="gq" style="font-size:19px">${jr(full).replace("⟦",'<span class="hl">').replace("⟧","</span>")} ${say(full.replace(/[⟦⟧]/g,""))}</div>`;}
  gResult(ok,ex+`<div class="gnote" style="text-align:left">💡 ${jr(q.why)}</div>`);
}
function gResult(ok,html){gTotal++;if(ok)gScore++;
  $("#gScoreBox").textContent=`맞힘 ${gScore} / 푼 문제 ${gTotal}`;
  $("#gFeed").innerHTML=`<div class="feed ${ok?'good':'bad'}"><div class="fh">${ok?'⭕ 정답!':'❌ 아쉬워요'}</div>${html}
    <button class="chip active nextb" onclick="gNewQuiz()">다음 문제 ▶</button></div>`;
}

function gSetView(v){gCur=v;
  ["list","card","quiz"].forEach(x=>$("#g-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("[data-gv]").forEach(t=>t.classList.toggle("active",t.dataset.gv===v));
  if(v==="list")gRenderList();
  if(v==="card")gStartCard();
  if(v==="quiz")gNewQuiz();
}
document.querySelectorAll("[data-gv]").forEach(t=>t.onclick=()=>gSetView(t.dataset.gv));

/* ── 시작 ── */
kRenderList();
renderChBar();
vRenderList();
gRenderBar();
gRenderList();
(function(){
  let q="";
  try{ q=new URLSearchParams(location.search).get("k")||(location.hash?decodeURIComponent(location.hash.slice(1)):""); }catch(e){}
  if(q&&KSET.has(q))kShow(q);
  let m="";
  try{ m=new URLSearchParams(location.search).get("m")||""; }catch(e){}
  if(m==="vocab"||m==="grammar")setMode(m);
})();
</script>
</body>
