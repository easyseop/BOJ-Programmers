<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 공부</title>
<style>
  :root{--accent:#8b7fc4;--accent-d:#6b5fae;--line:#e6e3f0;--bg:#f4f4f6;
        --card:#fff;--ink:#222;--muted:#777;--mark:#e9e6f3;--gold:#e8b53d;--ok:#5bbb72;}
  [data-theme="dark"]{--line:#33304a;--bg:#16151f;--card:#201e2d;--ink:#e8e6f0;
        --muted:#9a95b5;--mark:#2e2b42;--accent:#9d92d6;--accent-d:#b3a9e6;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--line:#33304a;--bg:#16151f;--card:#201e2d;--ink:#e8e6f0;
        --muted:#9a95b5;--mark:#2e2b42;--accent:#9d92d6;--accent-d:#b3a9e6;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  ruby rt{font-size:.5em;color:var(--muted);font-weight:400}
  .wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
  header .inner{max-width:748px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:15px;margin:0}
  .modes{display:flex;gap:4px;background:var(--mark);padding:3px;border-radius:20px}
  .mode{border:none;background:none;color:var(--muted);padding:5px 14px;border-radius:17px;font-size:13px;cursor:pointer;font-weight:600}
  .mode.active{background:var(--card);color:var(--accent-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ic{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
      padding:6px 10px;border-radius:20px;font-size:13px;cursor:pointer}
  .chbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin:14px 0 0}
  .chb{border:2px solid var(--line);background:var(--card);color:var(--muted);padding:6px 2px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.3;text-align:center}
  .chb .n{font-size:11px;font-weight:400;display:block}
  #gTopicBar .chb{white-space:normal;font-size:13.5px;line-height:1.25;padding:7px 4px;word-break:keep-all}
  .chb .ck{margin-right:3px;font-weight:400}
  .chtools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .chtools .chsum{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chtools .chsum b{color:var(--accent-d)}
  .chtools .chip{flex:none;padding:0 12px;min-height:32px;font-size:12.5px}
  .chb.active{border-color:var(--accent);color:var(--accent-d);background:var(--mark)}
  /* 탭: 3칸 균등 세그먼트 */
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:14px 0 0;
        background:var(--mark);padding:4px;border-radius:14px}
  .tab{border:none;background:none;color:var(--muted);padding:9px 0;border-radius:10px;
       font-size:14px;font-weight:700;cursor:pointer}
  .tab.active{background:var(--card);color:var(--accent-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  /* 필터 칩: 같은 크기 칸으로 정렬 (모바일 cN칸 / 넓은 화면 dN칸) */
  .filters{display:grid;gap:6px;margin:10px 0 0;grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (min-width:640px){
    .filters.d3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .filters.d4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .filters.d6{grid-template-columns:repeat(6,minmax(0,1fr))}
    .filters.d8{grid-template-columns:repeat(8,minmax(0,1fr))}
  }
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
        padding:0 4px;min-height:36px;border-radius:10px;font-size:13px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;text-align:center;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
  .empty .chip,.feed .nextb,.tin .chip{display:inline-flex;padding:0 18px}
  .chip.active{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
  .progress{margin:14px 2px 0;font-size:12px;color:var(--muted)}
  .bar{height:8px;background:var(--mark);border-radius:6px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0}
  .search{width:100%;padding:11px 14px;margin:12px 0 4px;border:1px solid var(--line);
          border-radius:10px;font-size:15px;background:var(--card);color:var(--ink)}
  .count{color:var(--muted);font-size:12px;margin:6px 2px 12px}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 2px 0}
  /* 한자 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 6px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative}
  .cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(110,95,174,.15);border-color:var(--accent)}
  .cell.learned{border-color:var(--ok)}
  .cell .k{font-size:34px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
  .cell .m{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .lv{position:absolute;top:6px;left:7px;font-size:9px;color:var(--muted);opacity:.7}
  .cell .fav{position:absolute;top:3px;right:5px;font-size:14px;color:var(--line);cursor:pointer;line-height:1}
  .cell .fav.on{color:var(--gold)}
  .cell .chk{position:absolute;bottom:4px;right:6px;font-size:11px;color:var(--ok);opacity:0}
  .cell.learned .chk{opacity:1}
  /* 단어 목록 */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.learned{border-color:var(--ok)}
  .row .jp{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:24px;line-height:1.5}
  .row .mean{margin-left:auto;text-align:right;font-size:15px;font-weight:600}
  .row .tagc{font-size:10px;color:var(--muted);display:block;font-weight:400;margin-top:2px}
  .mini{border:none;background:none;cursor:pointer;font-size:17px;opacity:.5;padding:2px}
  .mini:hover,.mini.on{opacity:1}
  .kl{color:inherit;text-decoration:none;border-bottom:1.5px dotted var(--accent);cursor:pointer}
  .kl:hover,.kl:active{color:var(--accent-d);background:var(--mark);border-radius:4px}
  /* 상세 */
  .nav{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px}
  .nav a{color:var(--accent-d);cursor:pointer;font-size:14px;font-weight:600;user-select:none}
  .nav a.dim{opacity:.3;pointer-events:none}
  .title{font-size:25px;font-weight:800;margin:2px 0;text-align:center}
  .stroke{text-align:center;margin:8px 0}
  .stroke svg{width:170px;height:170px}
  .stroke svg path{stroke:var(--ink)!important}
  .bigk{font-size:118px;line-height:1.05;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;margin:6px 0}
  .meta{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}
  .actions{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 15px;font-size:13px;cursor:pointer;color:var(--muted)}
  .btn.fav.on{background:#fef6e0;border-color:var(--gold);color:#9a7415}
  .btn.chk.on{background:#eafaef;border-color:var(--ok);color:#2e7d46}
  .sec{margin-top:28px}
  .sec h2{font-size:19px;color:var(--accent-d);margin:0;padding:6px 0 12px 14px;
          border-left:6px solid var(--accent);border-bottom:1px solid var(--line)}
  .sub{font-weight:700;color:var(--accent-d);font-size:15px;border-left:5px solid var(--accent);
       padding-left:10px;margin:18px 0 10px}
  .mark{background:var(--mark);padding:1px 7px;border-radius:5px;font-weight:700;margin-right:8px}
  ul{margin:10px 0;padding-left:20px}
  li{margin:6px 0}
  .ko{margin-left:6px}
  .note{color:var(--ink);opacity:.85}
  .jp{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px}
  .spk{cursor:pointer;border:none;background:none;font-size:15px;opacity:.55;margin-left:4px;color:inherit}
  .spk:hover{opacity:1}
  .en{color:var(--muted);font-size:13px}
  .todo{color:var(--muted);font-size:13px;background:var(--mark);border:1px dashed var(--line);
        border-radius:8px;padding:10px 12px;margin-top:8px}
  .tip{background:linear-gradient(135deg,#fff7e0,#fdeccb);border:1px solid #f0d089;
       border-radius:10px;padding:11px 14px;margin-top:12px;font-size:14px;color:#7a5a12}
  [data-theme="dark"] .tip{background:#3a3320;border-color:#6b5a2a;color:#e9d59b}
  .tip b{color:#b8860b}
  [data-theme="dark"] .tip b{color:#e8b53d}
  .backbar{background:var(--mark);border:1px solid var(--line);border-radius:10px;
           padding:9px 13px;margin-top:12px;font-size:13px;cursor:pointer;color:var(--accent-d);font-weight:600}
  /* 카드 */
  .fc{perspective:1200px;max-width:430px;margin:8px auto 0}
  .fcard{position:relative;display:grid;min-height:330px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
  .fcard.flip{transform:rotateY(180deg)}
  .face{grid-area:1/1;position:relative;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);
        border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .face.b{transform:rotateY(180deg)}
  .face .big{font-size:120px;font-family:"Yu Mincho",serif;line-height:1}
  .face .bigw{font-size:42px;font-family:"Yu Mincho",serif;line-height:1.5}
  .face .krbig{font-size:28px;font-weight:800;margin:4px 0}
  .face .rd{font-size:19px;color:var(--muted);font-family:"Yu Mincho",serif;margin-top:6px}
  .face .ko{font-size:25px;font-weight:800;margin:2px 0 4px}
  .face .en{color:var(--muted);font-size:13px;margin:0 0 6px}
  .fc-label{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
        border-radius:10px;padding:2px 10px;margin:8px 0 6px;letter-spacing:1px}
  .fc-read{margin:9px 0 0;text-align:center}
  .fc-read .rdl{font-size:16px;line-height:1.7}
  .fc-tag{font-size:10px;font-weight:700;color:#fff;border-radius:9px;padding:2px 8px;margin-right:6px}
  .fc-tag.on{background:var(--accent-d)} .fc-tag.kun{background:var(--ok)}
  .fc-ex{margin-top:3px}
  .fc-ex .jp{font-size:17px;font-weight:400}
  .fc-ex .ko{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
  .fc .fhint{color:var(--muted);font-size:12px;margin-top:10px}
  .fcbtns{display:flex;gap:12px;max-width:430px;margin:14px auto 0}
  .fcbtns button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:15px;cursor:pointer;background:var(--card);color:var(--ink)}
  .fcbtns .know{border-color:var(--ok);color:#2e7d46}
  .fcbtns .dunno{border-color:#d99;color:#b35}
  .navline{display:flex;justify-content:space-between;align-items:center;margin:12px auto 0;max-width:430px}
  .navline button{border:1px solid var(--line);background:var(--card);color:var(--accent-d);
       border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .navline button:disabled{opacity:.3;cursor:default}
  .navline .dirb{padding:3px 10px;margin-left:6px;font-size:12px}
  /* 퀴즈 */
  .quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin-top:14px;text-align:center}
  .quiz .q{font-size:80px;font-family:"Yu Mincho",serif;margin:4px 0 14px;line-height:1.2}
  .quiz .qw{font-size:40px;font-family:"Yu Mincho",serif;margin:4px 0 14px;line-height:1.4}
  .quiz .prompt{color:var(--muted);font-size:14px;margin-bottom:10px}
  .opts{display:grid;gap:10px;max-width:440px;margin:0 auto}
  .opt{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:15px}
  .opt:hover{border-color:var(--accent)}
  .opt.ok{background:#e3f5e8;border-color:var(--ok);color:#1c1c1c}
  .opt.no{background:#fbe6e6;border-color:#d97a7a;color:#1c1c1c}
  .score{margin-top:14px;color:var(--muted);font-size:13px}
  .quiz .qko{font-size:26px;font-weight:800;margin:6px 0 16px;line-height:1.4}
  .spk.big{font-size:17px;padding:12px 22px;margin:4px 0 16px;opacity:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:700}
  .tin{display:flex;gap:8px;max-width:360px;margin:0 auto}
  .tin input{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:18px;background:var(--bg);color:var(--ink)}
  .tin input:focus{outline:none;border-color:var(--accent)}
  .tin input.ok{border-color:var(--ok)} .tin input.no{border-color:#d97a7a}
  .linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:10px;cursor:pointer}
  .feed{margin:16px auto 0;max-width:440px;border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--bg)}
  .feed.good{border-color:var(--ok)} .feed.bad{border-color:#d97a7a}
  .feed .fh{font-weight:800;font-size:15px}
  .feed .fw{font-size:28px;font-family:"Yu Mincho",serif;margin:6px 0 0}
  .feed .fk{font-weight:700;margin-top:2px}
  .feed .nextb{margin-top:12px}
  .vexs{width:100%;text-align:left;margin-top:10px}
  .vex{background:var(--bg);border-radius:10px;padding:8px 11px;margin-top:6px}
  .vex .jp{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:2}
  .vex .ko{font-size:13px;color:var(--muted)}
  .vex .vf{display:inline-block;font-size:11.5px;color:var(--accent-d);background:var(--mark);border-radius:6px;padding:1px 7px;margin-top:3px}
  .tw{color:var(--accent-d);font-weight:700;border-bottom:2px solid var(--accent)}
  .vexrow{margin:-4px 0 10px;padding:0 4px}
  .spk.exb.on{opacity:1}
  .feed .vexs{margin-top:8px}
  .kbrk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
  .kb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--mark);border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .kb b{font-family:"Yu Mincho",serif;font-size:19px;font-weight:400}
  .empty{color:var(--muted);text-align:center;padding:36px}
  @media (max-width:430px){h1 .t{display:none}}
  .filters.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
  /* 문법 */
  .gbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
  .gbox h3{margin:0 0 6px;font-size:15px}
  .gi{padding:9px 0;border-top:1px dashed var(--line)} .gi:first-of-type{border-top:none;padding-top:2px}
  .gtips{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
  .gtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:2px 8px;margin-right:6px;vertical-align:middle;background:var(--accent);white-space:nowrap}
  .gtag[data-k="겸양어"]{background:var(--ok)} .gtag[data-k="정중어"]{background:var(--gold)} .gtag[data-k="특별경어"]{background:var(--accent-d)}
  .gh{display:flex;align-items:center;gap:6px}
  .gt{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:24px;flex:1;line-height:1.4}
  .gm{font-weight:800;margin:4px 0 2px}
  .gf{font-size:13px;color:var(--muted);margin-bottom:4px}
  .gex{padding:8px 11px;background:var(--bg);border-radius:10px;margin-top:6px}
  .gex .jp{font-size:18px;line-height:1.9}
  .gex .ko{font-size:13px;color:var(--muted)}
  .gnote{font-size:13px;margin-top:8px;background:var(--mark);border-radius:8px;padding:7px 10px;line-height:1.9}
  .gtbl{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
  .gtbl th{font-size:12px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
  .gtbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:15px;line-height:1.8;word-break:keep-all}
  .gtbl .ko{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:11px;color:var(--muted);display:block;line-height:1.3}
  .gtbl .none{color:var(--muted)}
  .gq{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:21px;line-height:2.1;margin:4px 0 6px}
  .gqk{font-size:13px;color:var(--muted);margin-bottom:14px}
  .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);height:1.1em;vertical-align:baseline}
  .hl{background:var(--mark);border-radius:4px;padding:0 3px;color:var(--accent-d);font-weight:700}
  .opt .jp{font-size:17px}
  .ord-ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:8px 0;margin:6px auto 14px;max-width:460px}
  .ord-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;margin:0 auto}
  .ord-c{border:1px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:10px;padding:4px 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:18px;line-height:1.9;cursor:pointer;color:var(--ink)}
  .ord-c.used{visibility:hidden}
  .ord-go{margin:16px auto 0;max-width:200px}
  .hide{display:none}
</style>
</head>
<body>
<header><div class="inner">
  <h1>🇯🇵 <span class="t">일본어 공부</span></h1>
  <div class="modes">
    <button class="mode active" data-mode="kanji">📚 한자</button>
    <button class="mode" data-mode="vocab">📖 단어장</button>
    <button class="mode" data-mode="grammar">📝 문법</button>
  </div>
  <button class="ic" id="theme" title="다크 모드">🌙</button>
</div></header>

<div class="wrap">
  <!-- ════ 한자 ════ -->
  <div id="m-kanji">
    <div class="tabs" id="kTabs">
      <button class="tab active" data-kv="list">목록</button>
      <button class="tab" data-kv="card">카드</button>
      <button class="tab" data-kv="quiz">퀴즈</button>
    </div>
    <div id="k-list">
      <div class="filters c3 d6" id="kLv"></div>
      <div class="filters c3" id="kSt"></div>
      <div class="progress" id="kProg"></div>
      <input class="search" id="kSearch" placeholder="한자·뜻·읽기·로마자 검색 (예: 日, 날, ニチ, nichi, day)">
      <div class="count" id="kCount"></div>
      <div class="grid" id="kGrid"></div>
    </div>
    <div id="k-detail" class="hide"></div>
    <div id="k-card" class="hide"></div>
    <div id="k-quiz" class="hide"></div>
  </div>

  <!-- ════ 단어장 ════ -->
  <div id="m-vocab" class="hide">
    <div class="chbar" id="vChBar"></div>
    <div class="chtools" id="vChTools"></div>
    <div class="tabs" id="vTabs">
      <button class="tab active" data-vv="list">목록</button>

","ex":[{"jp":"ちゃんと【謝(あやま)った】ほうがいいよ。","ko":"제대로 사과하는 게 좋아.","form":"謝る → 謝った (た형 + ほうがいい: ~하는 게 좋다)"},{"jp":"【謝(あやま)らなくて】いいよ。気(き)にしないで。","ko":"사과 안 해도 돼. 신경 쓰지 마.","form":"謝る → 謝らなくて (ない형 + くていい: ~하지 않아도 된다)"}]},{"w":"洗う","r":"あらう","ko":"씻다","t":"동사","ch":"CH1","ex":[{"jp":"ご飯(はん)の前(まえ)に手(て)を【洗(あら)って】ね。","ko":"밥 먹기 전에 손 씻어.","form":"洗う → 洗って (て형: 가벼운 부탁·지시)"},{"jp":"お皿(さら)は私(わたし)が【洗(あら)います】。","ko":"설거지는 제가 할게요.","form":"洗う → 洗います (정중형: ~할게요)"}]},{"w":"改める","r":"あらためる","ko":"고치다 (≒ なおす)","t":"동사","ch":"CH1","ex":[{"jp":"では、日(ひ)を【改(あらた)めて】ご連絡(れんらく)します。","ko":"그럼 날을 다시 잡아서 연락드리겠습니다.","form":"改める → 改めて (て형) / 日を改めて: 날을 바꿔서, 다음에 다시"},{"jp":"悪(わる)い習慣(しゅうかん)を【改(あらた)めよう】と思(おも)う。","ko":"나쁜 습관을 고치려고 한다.","form":"改める → 改めよう (의지형 + と思う: ~하려고 한다)"}]},{"w":"表す","r":"あらわす","ko":"나타내다","t":"동사","ch":"CH1","ex":[{"jp":"この記号(きごう)は何(なに)を【表(あらわ)して】いますか。","ko":"이 기호는 무엇을 나타내고 있나요?","form":"表す → 表して (て형 + いる: ~하고 있다)"},{"jp":"感謝(かんしゃ)の気持(きも)ちを【表(あらわ)したい】です。","ko":"감사의 마음을 표현하고 싶어요.","form":"表す → 表したい (たい형: ~하고 싶다)"}]},{"w":"歩く","r":"あるく","ko":"걷다","t":"동사","ch":"CH1","ex":[{"jp":"毎朝(まいあさ)、駅(えき)まで【歩(ある)いて】います。","ko":"매일 아침 역까지 걸어가요.","form":"歩く → 歩いて (て형 + いる: ~하고 있다)"},{"jp":"疲(つか)れて、もう【歩(ある)けない】よ。","ko":"지쳐서 더는 못 걷겠어.","form":"歩く → 歩けない (가능형 부정: ~할 수 없다)"}]},{"w":"生きる","r":"いきる","ko":"살다","t":"동사","ch":"CH1","ex":[{"jp":"祖父(そふ)は百歳(ひゃくさい)まで【生(い)きた】。","ko":"할아버지는 백 살까지 사셨다.","form":"生きる → 生きた (과거형)"},{"jp":"これからは自分(じぶん)らしく【生(い)きたい】。","ko":"앞으로는 나답게 살고 싶다.","form":"生きる → 生きたい (たい형: ~하고 싶다)"}]},{"w":"いじめる","r":"いじめる","ko":"괴롭히다","t":"동사","ch":"CH1","ex":[{"jp":"弟(おとうと)を【いじめないで】！","ko":"남동생 괴롭히지 마!","form":"いじめる → いじめないで (ないで: ~하지 마)"},{"jp":"彼(かれ)は小学生(しょうがくせい)の時(とき)、【いじめられて】いた。","ko":"그는 초등학생 때 괴롭힘을 당했었다.","form":"いじめる → いじめられて (수동형 + ていた: ~당하고 있었다)"}]},{"w":"急ぐ","r":"いそぐ","ko":"서두르다","t":"동사","ch":"CH1","ex":[{"jp":"【急(いそ)いで】！電車(でんしゃ)が出(で)ちゃうよ。","ko":"서둘러! 전철 떠나 버려.","form":"急ぐ → 急いで (て형: ~해!, 재촉)"},{"jp":"【急(いそ)がなくて】もいいですよ。","ko":"서두르지 않아도 돼요.","form":"急ぐ → 急がなくても (ない형 + くてもいい: ~하지 않아도 된다)"}]},{"w":"痛がる","r":"いたがる","ko":"아파하다","t":"동사","ch":"CH1","ex":[{"jp":"子(こ)どもが歯(は)を【痛(いた)がって】いる。","ko":"아이가 이가 아프다고 한다.","form":"痛がる → 痛がって (て형 + いる: 아파하고 있다)"},{"jp":"注射(ちゅうしゃ)のとき、娘(むすめ)は全然(ぜんぜん)【痛(いた)がらなかった】。","ko":"주사 맞을 때 딸은 전혀 아파하지 않았다.","form":"痛がる → 痛がらなかった (부정 과거형)"}]},{"w":"祈る","r":"いのる","ko":"기도하다","t":"동사","ch":"CH1","ex":[{"jp":"試験(しけん)の合格(ごうかく)を【祈(いの)って】います。","ko":"시험 합격을 기원하고 있어요.","form":"祈る → 祈って (て형 + いる: ~하고 있다)"},{"jp":"みんなの無事(ぶじ)を【祈(いの)りましょう】。","ko":"모두의 무사를 빕시다.","form":"祈る → 祈りましょう (ましょう: ~합시다)"}]},{"w":"居る","r":"いる","ko":"있다, 존재하다","t":"동사","ch":"CH1","ex":[{"jp":"明日(あした)は一日(いちにち)中(じゅう)家(いえ)に【居(い)ます】。","ko":"내일은 하루 종일 집에 있어요.","form":"居る → 居ます (정중형)"},{"jp":"もう少(すこ)しここに【居(い)ても】いいですか。","ko":"조금 더 여기 있어도 될까요?","form":"居る → 居ても (て형 + もいい: ~해도 된다)"}]},{"w":"要る","r":"いる","ko":"필요하다","t":"동사","ch":"CH1","ex":[{"jp":"袋(ふくろ)は【要(い)りますか】？","ko":"봉투 필요하세요?","form":"要る → 要りますか (정중형 의문, 계산대 표현)"},{"jp":"レシートは【要(い)らない】です。","ko":"영수증은 필요 없어요.","form":"要る → 要らない (부정형)"}]},{"w":"入れる","r":"いれる","ko":"넣다","t":"동사","ch":"CH1","ex":[{"jp":"コーヒーに砂糖(さとう)を【入(い)れますか】？","ko":"커피에 설탕 넣을까요?","form":"入れる → 入れますか (정중형 의문)"},{"jp":"かばんに傘(かさ)を【入(い)れて】おいた。","ko":"가방에 우산을 넣어 두었다.","form":"入れる → 入れて (て형 + おく: ~해 두다)"}]},{"w":"祝う","r":"いわう","ko":"축하하다","t":"동사","ch":"CH1","ex":[{"jp":"卒業(そつぎょう)を【祝(いわ)って】、乾杯(かんぱい)！","ko":"졸업을 축하하며, 건배!","form":"祝う → 祝って (て형: ~하며)"},{"jp":"友達(ともだち)の結婚(けっこん)を【祝(いわ)いに】行(い)った。","ko":"친구 결혼을 축하하러 갔다.","form":"祝う → 祝いに (ます형 + に行く: ~하러 가다)"}]},{"w":"青い","r":"あおい","ko":"파랗다","t":"い형용사","ch":"CH1","ex":[{"jp":"信号(しんごう)が【青(あお)く】なったら渡(わた)ってね。","ko":"신호가 파란불이 되면 건너.","form":"青い → 青く (く + なる: ~해지다)"},{"jp":"今日(きょう)は空(そら)が【青(あお)くて】きれいだね。","ko":"오늘은 하늘이 파랗고 예쁘네.","form":"青い → 青くて (くて: ~하고)"}]},{"w":"赤い","r":"あかい","ko":"빨갛다","t":"い형용사","ch":"CH1","ex":[{"jp":"恥(は)ずかしくて顔(かお)が【赤(あか)く】なった。","ko":"부끄러워서 얼굴이 빨개졌다.","form":"赤い → 赤く (く + なる: ~해지다)"},{"jp":"あの【赤(あか)い】屋根(やね)の家(いえ)が私(わたし)の家(いえ)です。","ko":"저 빨간 지붕 집이 우리 집이에요.","form":"赤い → 赤い (명사 수식: 빨간 ~)"}]},{"w":"明るい","r":"あかるい","ko":"밝다","t":"い형용사","ch":"CH1","ex":[{"jp":"彼女(かのじょ)は【明(あか)るくて】優(やさ)しい人(ひと)です。","ko":"그녀는 밝고 상냥한 사람이에요.","form":"明るい → 明るくて (くて: ~하고)"},{"jp":"【明(あか)るい】うちに帰(かえ)ろう。","ko":"밝을 때 집에 가자.","form":"明るい → 明るい + うちに (~할 때에, ~하는 동안에)"}]},{"w":"浅い","r":"あさい","ko":"얕다","t":"い형용사","ch":"CH1","ex":[{"jp":"プールの【浅(あさ)い】ところで遊(あそ)ぼう。","ko":"수영장의 얕은 곳에서 놀자.","form":"浅い → 浅い (명사 수식: 얕은 ~)"},{"jp":"最近(さいきん)、眠(ねむ)りが【浅(あさ)くて】疲(つか)れが取(と)れない。","ko":"요즘 잠이 얕아서 피로가 안 풀린다.","form":"浅い → 浅くて (くて: ~해서, 이유)"}]},{"w":"暖かい","r":"あたたかい","ko":"(기온이) 따뜻하다","t":"い형용사","ch":"CH1","ex":[{"jp":"だんだん【暖(あたた)かく】なってきましたね。","ko":"점점 따뜻해지고 있네요.","form":"暖かい → 暖かく (く + なる: ~해지다)"},{"jp":"昨日(きのう)は【暖(あたた)かかった】のに、今日(きょう)は寒(さむ)い。","ko":"어제는 따뜻했는데 오늘은 춥다.","form":"暖かい → 暖かかった (과거형)"}]},{"w":"温かい","r":"あたたかい","ko":"(온도가) 따뜻하다","t":"い형용사","ch":"CH1","ex":[{"jp":"【温(あたた)かい】うちに召(め)し上(あ)がってください。","ko":"따뜻할 때 드세요.","form":"温かい → 温かい + うちに (~할 때에)"},{"jp":"買(か)ってきたお弁当(べんとう)はまだ【温(あたた)かかった】。","ko":"사 온 도시락은 아직 따뜻했다.","form":"温かい → 温かかった (과거형)"}]},{"w":"新しい","r":"あたらしい","ko":"새롭다","t":"い형용사","ch":"CH1","ex":[{"jp":"駅前(えきまえ)に【新(あたら)しい】カフェができた。","ko":"역 앞에 새 카페가 생겼다.","form":"新しい → 新しい (명사 수식: 새 ~)"},{"jp":"スマホを【新(あたら)しく】した。","ko":"스마트폰을 새로 바꿨다.","form":"新しい → 新しく (く + する: 새로 하다)"}]},{"w":"厚い","r":"あつい","ko":"두껍다","t":"い형용사","ch":"CH1","ex":[{"jp":"この本(ほん)、【厚(あつ)くて】重(おも)い。","ko":"이 책 두껍고 무거워.","form":"厚い → 厚くて (くて: ~하고)"},{"jp":"パンを【厚(あつ)く】切(き)ってください。","ko":"빵을 두껍게 잘라 주세요.","form":"厚い → 厚く (부사형: 두껍게)"}]},{"w":"暑い","r":"あつい","ko":"덥다","t":"い형용사","ch":"CH1","ex":[{"jp":"今日(きょう)は本当(ほんとう)に【暑(あつ)かった】ね。","ko":"오늘은 정말 더웠지.","form":"暑い → 暑かった (과거형)"},{"jp":"【暑(あつ)すぎて】、何(なに)もしたくない。","ko":"너무 더워서 아무것도 하기 싫다.","form":"暑い → 暑すぎて (すぎる + て: 너무 ~해서)"}]},{"w":"熱い","r":"あつい","ko":"뜨겁다","t":"い형용사","ch":"CH1","ex":[{"jp":"コーヒーが【熱(あつ)くて】飲(の)めない。","ko":"커피가 뜨거워서 못 마시겠다.","form":"熱い → 熱くて (くて: ~해서, 이유)"},{"jp":"お風呂(ふろ)、ちょっと【熱(あつ)すぎる】よ。","ko":"목욕물이 좀 너무 뜨거워.","form":"熱い → 熱すぎる (すぎる: 너무 ~하다)"}]},{"w":"厚かましい","r":"あつかましい","ko":"뻔뻔하다","t":"い형용사","ch":"CH1","ex":[{"jp":"【厚(あつ)かましい】お願(ねが)いで、すみません。","ko":"염치없는 부탁이라 죄송합니다.","form":"厚かましい → 厚かましい (명사 수식: 염치없는 ~, 부탁할 때 관용 표현)"},{"jp":"彼(かれ)、ちょっと【厚(あつ)かましくない】？","ko":"걔 좀 뻔뻔하지 않아?","form":"厚かましい → 厚かましくない (부정형, 의문: ~하지 않아?)"}]},{"w":"明らかだ","r":"あきらかだ","ko":"분명하다, 명백하다","t":"な형용사","ch":"CH1","ex":[{"jp":"事故(じこ)の原因(げんいん)が【明(あき)らかに】なった。","ko":"사고 원인이 밝혀졌다.","form":"明らかだ → 明らかに (に + なる: 분명해지다, 밝혀지다)"},{"jp":"それは【明(あき)らかな】間違(まちが)いです。","ko":"그건 명백한 실수예요.","form":"明らかだ → 明らかな (명사 수식)"}]},{"w":"新ただ","r":"あらただ","ko":"새롭다","t":"な형용사","ch":"CH1","ex":[{"jp":"調査(ちょうさ)で【新(あら)たな】問題(もんだい)が見(み)つかった。","ko":"조사에서 새로운 문제가 발견되었다.","form":"新ただ → 新たな (명사 수식)"},{"jp":"気持(きも)ちを【新(あら)たに】、頑張(がんば)ります。","ko":"마음을 새롭게 하고 열심히 하겠습니다.","form":"新ただ → 新たに (부사형: 새로이)"}]},{"w":"安全だ","r":"あんぜんだ","ko":"안전하다","t":"な형용사","ch":"CH1","ex":[{"jp":"【安全(あんぜん)な】場所(ばしょ)に避難(ひなん)してください。","ko":"안전한 곳으로 대피해 주세요.","form":"安全だ → 安全な (명사 수식)"},{"jp":"雨(あめ)だから、【安全(あんぜん)に】運転(うんてん)してね。","ko":"비 오니까 안전하게 운전해.","form":"安全だ → 安全に (부사형: 안전하게)"}]},{"w":"意外だ","r":"いがいだ","ko":"의외이다, 뜻밖이다","t":"な형용사","ch":"CH1","ex":[{"jp":"彼(かれ)が料理(りょうり)上手(じょうず)なんて【意外(いがい)だった】。","ko":"그가 요리를 잘한다니 의외였다.","form":"意外だ → 意外だった (과거형)"},{"jp":"テストは【意外(いがい)に】簡単(かんたん)だった。","ko":"시험은 의외로 쉬웠다.","form":"意外だ → 意外に (부사형: 의외로)"}]},{"w":"偉大だ","r":"いだいだ","ko":"위대하다","t":"な형용사","ch":"CH1","ex":[{"jp":"エジソンは【偉大(いだい)な】発明家(はつめいか)だ。","ko":"에디슨은 위대한 발명가다.","form":"偉大だ → 偉大な (명사 수식)"},{"jp":"親(おや)になって、母(はは)が【偉大(いだい)だった】と気(き)づいた。","ko":"부모가 되고 나서 어머니가 위대했다는 걸 깨달았다.","form":"偉大だ → 偉大だった (과거형)"}]},{"w":"一生懸命だ","r":"いっしょうけんめいだ","ko":"열심이다","t":"な형용사","ch":"CH1","ex":[{"jp":"毎日(まいにち)【一生懸命(いっしょうけんめい)】働(はたら)いています。","ko":"매일 열심히 일하고 있어요.","form":"一生懸命だ → 一生懸命 (부사적 용법, 一生懸命に의 に 생략)"},{"jp":"子(こ)どもたちの【一生懸命(いっしょうけんめい)な】姿(すがた)に感動(かんどう)した。","ko":"아이들의 열심인 모습에 감동했다.","form":"一生懸命だ → 一生懸命な (명사 수식)"}]},{"w":"一般的だ","r":"いっぱんてきだ","ko":"일반적이다","t":"な형용사","ch":"CH1","ex":[{"jp":"【一般的(いっぱんてき)に】、女性(じょせい)のほうが長生(ながい)きだ。","ko":"일반적으로 여성이 더 오래 산다.","form":"一般的だ → 一般的に (부사형: 일반적으로)"},{"jp":"これはごく【一般的(いっぱんてき)な】やり方(かた)です。","ko":"이건 아주 일반적인 방법이에요.","form":"一般的だ → 一般的な (명사 수식)"}]},{"w":"嫌だ","r":"いやだ","ko":"싫다","t":"な형용사","ch":"CH1","ex":[{"jp":"なんだか【嫌(いや)な】予感(よかん)がする。","ko":"왠지 불길한 예감이 든다.","form":"嫌だ → 嫌な (명사 수식: 싫은, 불쾌한 ~)"},{"jp":"【嫌(いや)なら】、無理(むり)しなくていいよ。","ko":"싫으면 무리하지 않아도 돼.","form":"嫌だ → 嫌なら (なら: ~라면)"}]},{"w":"相変わらず","r":"あいかわらず","ko":"여전히, 변함없이","t":"부사","ch":"CH1","ex":[{"jp":"【相変(あいか)わらず】忙(いそが)しそうだね。","ko":"여전히 바빠 보이네.","form":"相変わらず: 여전히 (오랜만에 만났을 때 자주 씀)"}]},{"w":"あっさり","r":"あっさり","ko":"깨끗이, 담백히","t":"부사","ch":"CH1","ex":[{"jp":"夏(なつ)は【あっさり】した物(もの)が食(た)べたい。","ko":"여름에는 담백한 게 먹고 싶다.","form":"あっさりした〜: 담백한 ~ / あっさり負ける: 맥없이 지다"}]},{"w":"あまり","r":"あまり","ko":"별로, 그다지 (= あんまり)","t":"부사","ch":"CH1","ex":[{"jp":"朝(あさ)は【あまり】食欲(しょくよく)がない。","ko":"아침에는 별로 식욕이 없다.","form":"あまり〜ない: 별로 ~하지 않다 (부정과 함께)"}]},{"w":"あらゆる","r":"あらゆる","ko":"온갖, 모든","t":"부사","ch":"CH1","ex":[{"jp":"【あらゆる】方法(ほうほう)を試(ため)してみた。","ko":"온갖 방법을 다 시도해 봤다.","form":"あらゆる + 명사: 온갖 ~, 모든 ~"}]},{"w":"いちばん","r":"いちばん","ko":"가장, 제일, 최고임","t":"부사","ch":"CH1","ex":[{"jp":"この店(みせ)で【いちばん】人気(にんき)のメニューは何(なん)ですか。","ko":"이 가게에서 가장 인기 있는 메뉴는 뭐예요?","form":"いちばん + 형용사/명사: 가장 ~"}]},{"w":"いつも","r":"いつも","ko":"언제나, 늘","t":"부사","ch":"CH1","ex":[{"jp":"【いつも】お世話(せわ)になっております。","ko":"늘 신세 지고 있습니다.","form":"いつもお世話になっております: 비즈니스 인사 관용 표현"},{"jp":"じゃあ、【いつも】の店(みせ)で会(あ)おう。","ko":"그럼 늘 가던 가게에서 만나자.","form":"いつもの〜: 늘 하던(가던) ~"}]},{"w":"いまに","r":"いまに","ko":"머지않아, 곧","t":"부사","ch":"CH1","ex":[{"jp":"空(そら)が暗(くら)い。【いまに】雨(あめ)が降(ふ)り出(だ)すよ。","ko":"하늘이 어두워. 곧 비가 쏟아질 거야.","form":"いまに〜: 머지않아 ~할 것이다"},{"jp":"【いまに】見(み)てろよ。","ko":"두고 봐라.","form":"いまに見てろ: 두고 봐라 (관용 표현)"}]},{"w":"いよいよ","r":"いよいよ","ko":"점점, 드디어","t":"부사","ch":"CH1","ex":[{"jp":"【いよいよ】明日(あした)から夏休(なつやす)みだ！","ko":"드디어 내일부터 여름방학이다!","form":"いよいよ: 드디어 (기다리던 일이 다가올 때)"}]},{"w":"いらいら","r":"いらいら","ko":"안절부절, 짜증","t":"부사","ch":"CH1","ex":[{"jp":"電車(でんしゃ)が来(こ)なくて、【いらいら】する。","ko":"전철이 안 와서 짜증 난다.","form":"いらいらする: 짜증 나다, 초조하다"}]},{"w":"いろいろ","r":"いろいろ","ko":"여러 가지, 다양한","t":"부사","ch":"CH1","ex":[{"jp":"【いろいろ】ありがとうございました。","ko":"여러모로 감사했습니다.","form":"いろいろありがとう: 여러모로 고마워 (관용 표현)"},{"jp":"この店(みせ)には【いろいろな】国(くに)のビールがある。","ko":"이 가게에는 여러 나라 맥주가 있다.","form":"いろいろな + 명사: 여러 가지 ~"}]},{"w":"アイデア","r":"アイデア","ko":"아이디어","t":"가타카나어","ch":"CH1","ex":[{"jp":"それはいい【アイデア】だね！","ko":"그거 좋은 아이디어네!","form":"いいアイデア: 좋은 아이디어"}]},{"w":"アクセサリー","r":"アクセサリー","ko":"액세서리","t":"가타카나어","ch":"CH1","ex":[{"jp":"【アクセサリー】売(う)り場(ば)は2階(かい)です。","ko":"액세서리 매장은 2층입니다.","form":"アクセサリーをつける: 액세서리를 하다"}]},{"w":"アドバイス","r":"アドバイス","ko":"어드바이스, 충고","t":"가타카나어","ch":"CH1","ex":[{"jp":"先輩(せんぱい)に【アドバイス】をもらった。","ko":"선배에게 조언을 받았다.","form":"アドバイスをもらう/する: 조언을 받다/하다"}]},{"w":"アナウンサー","r":"アナウンサー","ko":"아나운서","t":"가타카나어","ch":"CH1","ex":[{"jp":"姉(あね)はテレビ局(きょく)の【アナウンサー】です。","ko":"언니는 방송국 아나운서예요.","form":""}]},{"w":"アルコール","r":"アルコール","ko":"알코올, 술","t":"가타카나어","ch":"CH1","ex":[{"jp":"【アルコール】は飲(の)めないので、ジュースにします。","ko":"술은 못 마셔서 주스로 할게요.","form":"アルコールが飲めない: 술을 못 마시다"}]},{"w":"アルバム","r":"アルバム","ko":"앨범","t":"가타카나어","ch":"CH1","ex":[{"jp":"昔(むかし)の【アルバム】を見(み)て、懐(なつ)かしくなった。","ko":"옛날 앨범을 보고 그리워졌다.","form":"アルバムを見る: 앨범을 보다"}]}];window.GRAMMAR={"topics":{"조사·동사 활용 표현":{"intro":[["대상·관련","について = 말하는 ‘내용’ / に対(たい)して = 행동이 향하는 ‘상대’ / にとって = 누구 ‘입장’에서의 평가","彼(かれ)は 私(わたし)に対(たい)して 冷(つめ)たい。","그는 나에게 차갑다."],["근거·수단","によって = 원인·수단·차이 / によると = 정보의 출처(뒤에 そうだ) / を通じて = 매개","天気予報(てんきよほう)によると 雨(あめ)だそうだ。","일기예보에 따르면 비가 온대."],["범위·변화","から〜にかけて = 대략적인 범위 / にわたって = 범위 전체 / にしたがって = 함께 변화","三日間(みっかかん)にわたって 雨(あめ)が降(ふ)った。","사흘에 걸쳐 비가 왔다."]],"tips":["‘~에 대하여’가 두 개! について(내용) vs に対(たい)して(상대·태도): 日本(にほん)についての本(ほん) / 先生(せんせい)に対(たい)して失礼(しつれい)だ","명사를 꾸밀 때 모양이 바뀌어요: に関(かん)して→に関(かん)する, について→についての, に対(たい)して→に対(たい)する, にとって→にとっての","によって는 뜻이 3가지(원인·수단·차이) → 예문째로 외우기"]},"명사 활용 표현 1":{"intro":[["결정·규칙","ことにする = 내가 정함 / ことになる = (회사·상황 때문에) 정해짐","来月(らいげつ)、結婚(けっこん)することになりました。","다음 달에 결혼하게 되었습니다."],["ところ","동사 모양으로 직전·진행 중·직후를 구별","今(いま)、駅(えき)に着(つ)いたところです。","지금 막 역에 도착했어요."],["판단·전문","わけ・もの・ということ로 판단·회상·전달","そんなことがあるわけがない。","그런 일이 있을 리가 없다."]],"tips":["ことにする(내가 결정) ↔ ことになる(정해짐) / ことにしている(내 습관) ↔ ことになっている(규칙·예정)","ところ 3형제: 食(た)べるところ(먹기 직전) / 食(た)べているところ(먹는 중) / 食(た)べたところ(막 먹었음)","わけがない(그럴 리 없다: 가능성 부정) ↔ わけにはいかない(사정상 할 수는 없다)","たことがある(~한 적이 있다: 경험) ↔ ことがある(가끔 ~할 때가 있다)"]},"경어":{"intro":[["존경어","상대(윗사람)의 행동을 높여요. 주어 = 상대방","先生(せんせい)が いらっしゃいます。","선생님이 오십니다."],["겸양어","내(우리 쪽) 행동을 낮춰서 상대를 높여요. 주어 = 나","私(わたし)が 参(まい)ります。","제가 가겠습니다."],["정중어","문장 전체를 공손하게. です・ます・ございます","トイレは あちらで ございます。","화장실은 저쪽입니다."]],"tips":["헷갈리면 “누가 하는 행동?”부터: 상대 → 존경어, 나 → 겸양어","회사 밖 사람에게 우리 회사 사람(사장 포함) 얘기를 할 때는 겸양어를 써요 (ウチ・ソト)","외우는 순서: ① 공식(お〜になる / お〜する) → ② 특별 경어 표 → ③ 정중어"]}},"items":[{"id":"k01","topic":"경어","kind":"존경어","title":"お〜になる","form":"お + 동사 ます형 + になる","mean":"~하시다 (상대의 행동을 높임)","ex":[["先生(せんせい)は/もう/お帰(かえ)りに/なりました。","선생님은 벌써 돌아가셨습니다."],["社長(しゃちょう)は/この本(ほん)を/お読(よ)みに/なりましたか。","사장님은 이 책을 읽으셨습니까?"]],"note":"見(み)ます・寝(ね)ます처럼 ます형이 한 글자인 동사는 못 써요 → ご覧(らん)になる・お休(やす)みになる (특별 경어)","q":[{"s":"部長(ぶちょう)は もう ＿＿。","a":"お帰(かえ)りになりました","o":["お帰(かえ)りしました","帰(かえ)りになりました","お帰(かえ)りいたしました"],"k":"부장님은 벌써 돌아가셨습니다.","why":"부장님(상대)의 행동 → 존경어 お〜になる. お〜する는 겸양어예요."}]},{"id":"k02","topic":"경어","kind":"존경어","title":"ご〜になる","form":"ご + 한자어(する동사) + になる","mean":"~하시다 (한자어 동사의 존경)","ex":[["お客様(きゃくさま)は/もう/ご出発(しゅっぱつ)に/なりました。","손님은 벌써 출발하셨습니다."],["先生(せんせい)は/この部屋(へや)を/ご利用(りよう)に/なります。","선생님은 이 방을 이용하십니다."]],"note":"利用(りよう)・出発(しゅっぱつ)・説明(せつめい)처럼 한자어에는 お 대신 ご를 붙여요.","q":[{"s":"社長(しゃちょう)は 明日(あした) ＿＿。","a":"ご出発(しゅっぱつ)になります","o":["お出発(しゅっぱつ)になります","ご出発(しゅっぱつ)します","出発(しゅっぱつ)になります"],"k":"사장님은 내일 출발하십니다.","why":"한자어 出発 → ご. 사장님의 행동이니 になる(존경)."}]},{"id":"k03","topic":"경어","kind":"존경어","title":"〜(ら)れる","form":"1그룹 ない형 + れる / 2그룹 + られる / する → される / 来(く)る → 来(こ)られる","mean":"~하시다 (수동형과 같은 모양의 존경)","ex":[["先生(せんせい)が/新(あたら)しい本(ほん)を/書(か)かれました。","선생님이 새 책을 쓰셨습니다."],["部長(ぶちょう)は/何時(なんじ)に/来(こ)られますか。","부장님은 몇 시에 오십니까?"]],"note":"お〜になる보다 조금 가벼운 존경. 수동형(~당하다)과 모양이 같으니 문맥으로 구별해요.","q":[{"s":"社長(しゃちょう)は 毎朝(まいあさ) 新聞(しんぶん)を ＿＿。","a":"読(よ)まれます","o":["読(よ)ませます","読(よ)めます","お読(よ)みします"],"k":"사장님은 매일 아침 신문을 읽으십니다.","why":"読む → 読まれる(존경). 読ませる는 사역, 読める는 가능형이에요."}]},{"id":"k04","topic":"경어","kind":"존경어","title":"お〜ください","form":"お + 동사 ます형 + ください / ご + 한자어 + ください","mean":"~해 주십시오 (〜てください의 공손한 말)","ex":[["少々(しょうしょう)/お待(ま)ち/ください。","잠시 기다려 주십시오."],["こちらの/エレベーターを/ご利用(りよう)/ください。","이쪽 엘리베이터를 이용해 주십시오."]],"note":"가게·역 안내 방송에서 정말 자주 들려요.","q":[{"s":"少々(しょうしょう) ＿＿ください。","a":"お待(ま)ち","o":["お待(ま)って","ご待(ま)ち","待(ま)ちに"],"k":"잠시 기다려 주십시오.","why":"お + ます형(待ち) + ください. 待つ는 고유어라 ご가 아니라 お."}]},{"id":"k05","topic":"경어","kind":"겸양어","title":"お〜する / いたす","form":"お + 동사 ます형 + する(いたす) / ご + 한자어 + する(いたす)","mean":"(제가) ~해 드리다","ex":[["荷物(にもつ)を/お持(も)ち/します。","짐을 들어 드리겠습니다."],["会議室(かいぎしつ)まで/ご案内(あんない)/いたします。","회의실까지 안내해 드리겠습니다."]],"note":"주어는 나(우리 쪽). 손님의 행동에 쓰면 실례예요! いたす는 する보다 더 공손해요.","q":[{"s":"先生(せんせい)、その荷物(にもつ)、私(わたし)が ＿＿。","a":"お持(も)ちします","o":["お持(も)ちになります","持(も)たれます","お持(も)ちください"],"k":"선생님, 그 짐 제가 들어 드릴게요.","why":"내가 하는 행동 → 겸양어 お〜する."},{"s":"それでは、会場(かいじょう)まで ＿＿いたします。","a":"ご案内(あんない)","o":["お案内(あんない)","ご案内(あんない)に","案内(あんない)して"],"k":"그럼 회장까지 안내해 드리겠습니다.","why":"한자어 案内 → ご + 案内 + いたす."}]},{"id":"k06","topic":"경어","kind":"겸양어","title":"〜させていただく","form":"동사 사역형(させる)의 て형 + いただく","mean":"(허락을 받아) ~하겠습니다 / ~해도 될까요","ex":[["今日(きょう)は/これで/帰(かえ)らせて/いただきます。","오늘은 이만 돌아가겠습니다."],["明日(あした)/休(やす)ませて/いただけますか。","내일 쉬어도 될까요?"]],"note":"회사·아르바이트에서 허락을 구할 때 필수 표현. いただけますか로 물으면 아주 공손해요.","q":[{"s":"すみません、明日(あした) ＿＿いただけませんか。","a":"休(やす)ませて","o":["休(やす)んで","休(やす)まれて","お休(やす)みして"],"k":"죄송한데, 내일 쉬어도 될까요?","why":"休む의 사역 休ませる → 休ませていただく(허락을 받아 쉬다)."}]},{"id":"k07","topic":"경어","kind":"정중어","title":"ございます / でございます","form":"ある → ございます / です → でございます","mean":"있습니다 / ~입니다 (가장 공손한 말투)","ex":[["トイレは/2階(かい)に/ございます。","화장실은 2층에 있습니다."],["こちらが/新(あたら)しい/商品(しょうひん)で/ございます。","이쪽이 새 상품입니다."]],"note":"사람에게는 ございます가 아니라 いらっしゃいます(존경)/おります(겸양)를 써요.","q":[{"s":"お手洗(てあら)いは あちらに ＿＿。","a":"ございます","o":["いらっしゃいます","でございます","おられます"],"k":"화장실은 저쪽에 있습니다.","why":"물건·장소가 '있다'(ある) → ございます. いらっしゃる는 사람에게."}]},{"id":"k08","topic":"경어","kind":"정중어","title":"お / ご (미화어)","form":"お + 고유어(和語(わご)) / ご + 한자어(漢語(かんご))","mean":"말을 곱게 만드는 접두어","ex":[["お茶(ちゃ)を/どうぞ。","차 드세요."],["ご家族(かぞく)は/お元気(げんき)ですか。","가족분들은 잘 지내세요?"]],"note":"예외: お電話(でんわ)・お時間(じかん)・ご飯(はん)처럼 한자어인데 お를 쓰는 말도 있어요. 外来語(がいらいご)(コーヒー 등)에는 보통 안 붙여요.","q":[{"s":"＿＿家族(かぞく)は お元気(げんき)ですか。","a":"ご","o":["お","おご"],"k":"가족분들은 잘 지내세요?","why":"家族는 한자어 → ご."},{"s":"あとで ＿＿電話(でんわ)します。","a":"お","o":["ご","おご"],"k":"나중에 전화 드리겠습니다.","why":"電話는 한자어지만 예외로 お電話."}]},{"id":"k09","topic":"경어","kind":"특별경어","title":"특별 존경어 · 겸양어","form":"공식(お〜になる/お〜する) 대신 아예 다른 단어를 쓰는 동사","mean":"자주 쓰는 동사는 통째로 외우기!","ex":[["先生(せんせい)は/明日(あした)/学校(がっこう)に/いらっしゃいます。","선생님은 내일 학교에 오십니다."],["明日(あした)/私(わたし)が/会社(かいしゃ)に/参(まい)ります。","내일 제가 회사로 가겠습니다."],["何(なに)を/召(め)し上(あ)がりますか。","무엇을 드시겠어요?"],["私(わたし)は/田中(たなか)と/申(もう)します。","저는 다나카라고 합니다."]],"note":"아래 표의 존경어 ↔ 겸양어를 짝으로 외우세요. 경어 바꾸기 퀴즈로 연습할 수 있어요.","q":[{"s":"先生(せんせい)、この写真(しゃしん)を ＿＿か。","a":"ご覧(らん)になりました","o":["拝見(はいけん)しました","ご覧(らん)しました","お見(み)になりました"],"k":"선생님, 이 사진을 보셨습니까?","why":"선생님이 보다 → 존경어 ご覧になる. 拝見する는 내가 볼 때(겸양)."},{"s":"社長(しゃちょう)の お写真(しゃしん)を ＿＿。","a":"拝見(はいけん)しました","o":["ご覧(らん)になりました","拝見(はいけん)になりました","お見(み)しました"],"k":"사장님 사진을 보았습니다.","why":"내가 보다 → 겸양어 拝見する."},{"s":"何(なに)を ＿＿か。","a":"召(め)し上(あ)がります","o":["いただきます","召(め)し上(あ)がりします","お食(た)べします"],"k":"무엇을 드시겠어요?","why":"상대가 먹다 → 召し上がる. いただく는 내가 먹을 때."},{"s":"私(わたし)は 田中(たなか)と ＿＿。","a":"申(もう)します","o":["おっしゃいます","申(もう)されます","言(い)われます"],"k":"저는 다나카라고 합니다.","why":"내가 말하다 → 申す. おっしゃる는 상대가 말할 때."},{"s":"先生(せんせい)は 明日(あした) 学校(がっこう)に ＿＿か。","a":"いらっしゃいます","o":["参(まい)ります","おります","伺(うかが)います"],"k":"선생님은 내일 학교에 오십니까?","why":"선생님의 행동 → いらっしゃる. 参る・伺う・おる는 겸양어."},{"s":"明日(あした)、私(わたし)が 会社(かいしゃ)に ＿＿。","a":"参(まい)ります","o":["いらっしゃいます","おいでになります","参(まい)られます"],"k":"내일 제가 회사로 가겠습니다.","why":"내가 가다 → 参る."},{"s":"社長(しゃちょう)の 電話番号(でんわばんごう)を ＿＿か。","a":"ご存(ぞん)じです","o":["存(ぞん)じます","お知(し)りです","ご存(ぞん)じします"],"k":"사장님 전화번호를 아세요?","why":"상대가 알다 → ご存じだ. 存じる는 내가 알 때."},{"s":"先生(せんせい)に 本(ほん)を ＿＿。","a":"いただきました","o":["くださいました","差(さ)し上(あ)げました","召(め)し上(あ)がりました"],"k":"선생님께 책을 받았습니다.","why":"내가 받다(もらう) → いただく."},{"s":"先生(せんせい)が 本(ほん)を ＿＿。","a":"くださいました","o":["いただきました","差(さ)し上(あ)げました","申(もう)しました"],"k":"선생님이 (저에게) 책을 주셨습니다.","why":"상대가 나에게 주다(くれる) → くださる."},{"s":"明日(あした) 先生(せんせい)の お宅(たく)に ＿＿。","a":"伺(うかが)います","o":["いらっしゃいます","お訪(たず)ねになります","おいでになります"],"k":"내일 선생님 댁에 찾아뵙겠습니다.","why":"내가 방문하다 → 伺う."}]},{"id":"j01","topic":"조사·동사 활용 표현","kind":"비교·추가","title":"〜に代(か)わって","form":"명사 + に代(か)わって","mean":"~을 대신하여 (사람·물건을 대신함)","ex":[["社長(しゃちょう)に/代(か)わって/田中(たなか)部長(ぶちょう)が/あいさつを/した。","사장님을 대신해서 다나카 부장이 인사를 했다."],["手紙(てがみ)に/代(か)わって/メールが/よく/使(つか)われる/ように/なった。","편지 대신 메일이 자주 쓰이게 되었다."]],"note":"명사를 꾸밀 때는 〜に代(か)わる＋명사: 石油(せきゆ)に代(か)わるエネルギー (석유를 대신할 에너지)","q":[{"s":"入院中(にゅういんちゅう)の父(ちち)＿＿、母(はは)が店(みせ)を開(あ)けている。","a":"に代(か)わって","o":["に加(くわ)えて","に比(くら)べて","にとって"],"k":"입원 중인 아버지를 대신해서 어머니가 가게를 열고 있다.","why":"아버지 대신 → に代わって."}]},{"id":"j02","topic":"조사·동사 활용 표현","kind":"비교·추가","title":"〜に比(くら)べて","form":"명사 + に比(くら)べて","mean":"~에 비해서, ~과 비교하여 (정도의 차이)","ex":[["去年(きょねん)に/比(くら)べて/今年(ことし)の冬(ふゆ)は/かなり/寒(さむ)かった。","작년에 비해 올해 겨울은 꽤 추웠다."],["田舎(いなか)は/都会(とかい)に/比(くら)べて、/空気(くうき)が/きれいだ。","시골은 도시에 비해 공기가 깨끗하다."]],"note":"뒤에 ‘더 ~하다 / 덜 ~하다’ 같은 정도의 차이가 와요. 〜に比(くら)べると도 같은 뜻.","q":[{"s":"東京(とうきょう)は 大阪(おおさか)＿＿物価(ぶっか)が高(たか)い。","a":"に比(くら)べて","o":["に代(か)わって","にとって","について"],"k":"도쿄는 오사카에 비해 물가가 비싸다.","why":"두 곳의 정도 차이를 비교 → に比べて."}]},{"id":"j03","topic":"조사·동사 활용 표현","kind":"비교·추가","title":"〜に加(くわ)えて","form":"명사 + に加(くわ)えて","mean":"~에 더하여, ~에 덧붙여","ex":[["電車代(でんしゃだい)に/加(くわ)えて、/バス代(だい)も/あがって/しまった。","전철 요금에 더해 버스 요금도 올라 버렸다."],["雨(あめ)に/加(くわ)えて/風(かぜ)も/強(つよ)く/なって/きた。","비에 더해 바람도 강해졌다."]],"note":"뒤에 ‘~도(も)’가 자주 와요: A に加(くわ)えて B も","q":[{"s":"熱(ねつ)＿＿、せきも出(で)てきた。","a":"に加(くわ)えて","o":["に代(か)わって","に比(くら)べて","について"],"k":"열에 더해 기침도 나기 시작했다.","why":"열 + 기침(も) → 추가 = に加(くわ)えて."}]},{"id":"j04","topic":"조사·동사 활용 표현","kind":"대상·관련","title":"〜に対(たい)して","form":"명사 + に対(たい)して / (대비) 보통형 + のに対(たい)して","mean":"① ~에 대하여, ~에게 (대상·상대)  ② ~과는 대조적으로, ~에 비해 (대비·비교)","ex":[["山田先生(やまだせんせい)は/質問(しつもん)に/対(たい)して、/ていねいに/説明(せつめい)して/くれる。","① 야마다 선생님은 질문에 대해 친절하게 설명해 준다."],["この博物館(はくぶつかん)では/外国人(がいこくじん)旅行者(りょこうしゃ)に/対(たい)して/割引(わりびき)サービスを/行(おこな)っている。","① 이 박물관에서는 외국인 여행자에게 할인 서비스를 하고 있다."],["ひらがなは/音(おと)だけを/表(あらわ)すのに/対(たい)して、/漢字(かんじ)は/意味(いみ)も/表(あらわ)して/います。","② 히라가나는 소리만 나타내는 데 비해 한자는 의미도 나타냅니다."],["木(き)の家(いえ)は/地震(じしん)に/強(つよ)いのに/対(たい)して、/火事(かじ)には/弱(よわ)い。","② 나무집은 지진에 강한 반면 화재에는 약하다."]],"note":"について는 ‘내용’, に対(たい)して는 행동이 향하는 ‘상대’: 先生(せんせい)に対(たい)して失礼(しつれい)だ (O) / 先生(せんせい)について失礼(しつれい)だ (X)","q":[{"s":"子(こ)どもの質問(しつもん)＿＿、ていねいに答(こた)える。","a":"に対(たい)して","o":["にとって","に比(くら)べて","に代(か)わって"],"k":"아이의 질문에 대해 친절하게 대답한다.","why":"대답하는 행동이 향하는 대상 → に対(たい)して."},{"s":"兄(あに)は背(せ)が高(たか)いの＿＿、弟(おとうと)は低(ひく)い。","a":"に対(たい)して","o":["について","に加(くわ)えて","によって"],"k":"형은 키가 큰 반면 동생은 작다.","why":"두 사람을 대조 → 〜のに対(たい)して (대비)."}]},{"id":"j05","topic":"조사·동사 활용 표현","kind":"대상·관련","title":"〜について","form":"명사 + について","mean":"~에 대하여 (말하거나 생각하는 내용·주제)","ex":[["この問題(もんだい)に/ついて/よく/考(かんが)えて/おいて/ください。","이 문제에 대해 잘 생각해 두세요."],["彼(かれ)は/車(くるま)が/好(す)きで、/車(くるま)に/ついて/よく/知(し)って/いる。","그는 차를 좋아해서 차에 대해 잘 안다."]],"note":"명사를 꾸밀 때는 〜についての＋명사: 日本(にほん)の文化(ぶんか)についての本(ほん)","q":[{"s":"日本(にほん)の歴史(れきし)＿＿レポートを書(か)いた。","a":"について","o":["にとって","に代(か)わって","に比(くら)べて"],"k":"일본 역사에 대해 리포트를 썼다.","why":"리포트의 ‘내용·주제’ → について."}]},{"id":"j06","topic":"조사·동사 활용 표현","kind":"대상·관련","title":"〜に関(かん)して","form":"명사 + に関(かん)して","mean":"~에 관하여 (について보다 딱딱한 느낌)","ex":[["発表(はっぴょう)の/内容(ないよう)に/関(かん)して、/何(なに)か/質問(しつもん)は/ありませんか。","발표 내용에 관해 뭔가 질문은 없습니까?"],["料理(りょうり)に/関(かん)する/雑誌(ざっし)が、/毎月(まいつき)/新(あたら)しく/出(で)て/いる。","요리에 관한 잡지가 매달 새로 나오고 있다."]],"note":"명사를 꾸밀 때는 〜に関(かん)する＋명사. 회의·발표·안내문에서 자주 써요.","q":[{"s":"料理(りょうり)＿＿雑誌(ざっし)を毎月(まいつき)買(か)っている。","a":"に関(かん)する","o":["に関(かん)して","にとって","に対(たい)して"],"k":"요리에 관한 잡지를 매달 사고 있다.","why":"뒤에 명사(雑誌)가 오니까 명사 수식형 に関する."}]},{"id":"j07","topic":"조사·동사 활용 표현","kind":"대상·관련","title":"〜にとって","form":"명사 + にとって","mean":"~에게 있어서, ~에게 (누구의 입장인지 → 뒤에 판단·평가)","ex":[["私(わたし)に/とって/いちばん/大切(たいせつ)なのは/家族(かぞく)です。","나에게 가장 소중한 것은 가족입니다."],["日本人(にほんじん)に/とって/花火(はなび)の/ない/夏(なつ)は/考(かんが)えられない。","일본인에게 불꽃놀이 없는 여름은 생각할 수 없다."]],"note":"뒤에 大切(たいせつ)だ・難(むずか)しい・うれしい 같은 ‘평가’가 와요. 말하다·친절하다 같은 행동·태도에는 に対(たい)して.","q":[{"s":"学生(がくせい)＿＿、夏休(なつやす)みはいちばん楽(たの)しい時期(じき)だ。","a":"にとって","o":["に対(たい)して","について","に関(かん)して"],"k":"학생에게 있어서 여름방학은 가장 즐거운 시기다.","why":"학생의 ‘입장’에서 즐겁다는 평가 → にとって."}]},{"id":"j08","topic":"조사·동사 활용 표현","kind":"근거·수단","title":"〜によって","form":"명사 + によって","mean":"~에 의해, ~에 따라 (① 이유·원인 ② 수단·방법 ③ 차이)","ex":[["台風(たいふう)に/よって/電車(でんしゃ)が/止(と)まった。","① 이유·원인: 태풍으로 인해 전철이 멈췄다."],["問題(もんだい)を/話(はな)し合(あ)いに/よって/解決(かいけつ)する。","② 수단·방법: 문제를 대화로 해결한다."],["人(ひと)に/よって/考(かんが)え方(かた)が/違(ちが)う。","③ 차이: 사람에 따라 사고방식이 다르다."]],"note":"수동문의 행위자에도 써요: この絵(え)はピカソによって描(か)かれた。(이 그림은 피카소에 의해 그려졌다)","q":[{"s":"国(くに)＿＿習慣(しゅうかん)が違(ちが)う。","a":"によって","o":["にとって","について","に加(くわ)えて"],"k":"나라에 따라 습관이 다르다.","why":"‘~에 따라 다르다’(차이) → によって."},{"s":"事故(じこ)＿＿電車(でんしゃ)が遅(おく)れている。","a":"によって","o":["によると","にとって","に対(たい)して"],"k":"사고로 인해 전철이 늦어지고 있다.","why":"원인 → によって. によると는 정보의 출처."}]},{"id":"j09","topic":"조사·동사 활용 표현","kind":"근거·수단","title":"〜によると・〜によれば","form":"명사 + によると・によれば","mean":"~에 의하면, ~에 따르면 (전달하는 내용의 근거)","ex":[["天気予報(てんきよほう)に/よると、/大雨(おおあめ)が/降(ふ)る/そうです。","일기예보에 따르면 큰비가 내린다고 합니다."],["山田(やまだ)さんの/話(はなし)に/よれば、/中村(なかむら)さんは/明日(あした)/アメリカに/行(い)く/そうだ。","야마다 씨 이야기에 따르면 나카무라 씨는 내일 미국에 간대."]],"note":"뒤에 〜そうだ・〜らしい・〜ということだ(들은 이야기)가 짝으로 와요.","q":[{"s":"ニュース＿＿、明日(あした)は雪(ゆき)が降(ふ)るそうだ。","a":"によると","o":["によって","にとって","に対(たい)して"],"k":"뉴스에 따르면 내일은 눈이 온대.","why":"정보의 출처 + そうだ → によると."}]},{"id":"j10","topic":"조사·동사 활용 표현","kind":"범위·변화","title":"〜から〜にかけて","form":"명사 + から + 명사 + にかけて","mean":"~부터 ~에 걸쳐서 (시간·공간 범위를 대략적으로)","ex":[["この辺(へん)は、/春(はる)から/夏(なつ)に/かけて、/花(はな)が/たくさん/咲(さ)く。","이 주변은 봄부터 여름에 걸쳐 꽃이 많이 핀다."],["南部地方(なんぶちほう)から/中部地方(ちゅうぶちほう)に/かけて/強(つよ)い/雨(あめ)が/降(ふ)って/いる。","남부 지방에서 중부 지방에 걸쳐 강한 비가 내리고 있다."]],"note":"から〜まで는 시작·끝이 분명할 때, から〜にかけて는 ‘그쯤’의 대략적인 범위. 일기예보에서 자주 들려요.","q":[{"s":"今夜(こんや)から明日(あした)の朝(あさ)＿＿、雪(ゆき)が降(ふ)るでしょう。","a":"にかけて","o":["にわたって","にとって","について"],"k":"오늘 밤부터 내일 아침에 걸쳐 눈이 오겠습니다.","why":"から〜にかけて 짝. にわたって 앞에는 から가 오지 않아요."}]},{"id":"j11","topic":"조사·동사 활용 표현","kind":"범위·변화","title":"〜にわたって","form":"명사 + にわたって","mean":"~에 걸쳐서 (시간·공간 범위 전체에 걸쳐)","ex":[["5回(かい)に/わたって/話(はな)し合(あ)いを/行(おこな)った。","5회에 걸쳐 논의를 했다."],["一週間(いっしゅうかん)に/わたって/試験(しけん)が/行(おこな)われた。","일주일에 걸쳐 시험이 치러졌다."]],"note":"앞에 기간·횟수·범위(3日間(みっかかん)・10年(ねん)・全国(ぜんこく))가 와요. 시작·끝을 따로 말하지 않아요.","q":[{"s":"工事(こうじ)は 3か月(げつ)＿＿続(つづ)いた。","a":"にわたって","o":["にかけて","にとって","によると"],"k":"공사는 3개월에 걸쳐 계속되었다.","why":"‘3개월’이라는 기간 전체 → にわたって."}]},{"id":"j12","topic":"조사·동사 활용 표현","kind":"확신·마음","title":"〜に違(ちが)いない","form":"동사·い형용사 보통형 / な형용사 어간·명사 + に違(ちが)いない","mean":"~임에 틀림없다 (마음속으로 강하게 확신)","ex":[["電気(でんき)が/消(き)えて/いるから、/もう/寝(ね)て/いるに/違(ちが)いない。","불이 꺼져 있으니까 벌써 자고 있는 게 틀림없다."],["10か国語(こくご)を/話(はな)すなんて、/高橋(たかはし)さんは/天才(てんさい)に/違(ちが)いない。","10개 국어를 하다니 다카하시 씨는 천재임에 틀림없다."]],"note":"な형용사·명사는 だ 없이 바로: 天才(てんさい)だに違(ちが)いない (X) → 天才(てんさい)に違(ちが)いない (O)","q":[{"s":"あの店(みせ)はいつも人(ひと)が並(なら)んでいるから、おいしい＿＿。","a":"に違(ちが)いない","o":["にしたがって","に比(くら)べて","にわたって"],"k":"저 가게는 항상 사람들이 줄 서 있으니까 맛있는 게 틀림없다.","why":"근거(줄 서 있음)로 강하게 확신 → に違(ちが)いない."}]},{"id":"j13","topic":"조사·동사 활용 표현","kind":"범위·변화","title":"〜にしたがって","form":"동사 기본형 / 명사 + にしたがって","mean":"~에 따라서 (한쪽이 변하면 다른 쪽도 함께 변함)","ex":[["人(ひと)は/年(とし)を/とるに/したがって、/体力(たいりょく)が/だんだん/弱(よわ)く/なる。","사람은 나이를 먹음에 따라 체력이 점점 약해진다."],["工業化(こうぎょうか)に/したがって、/自然環境(しぜんかんきょう)の/破壊(はかい)が/広(ひろ)がった。","공업화에 따라 자연환경 파괴가 확산되었다."]],"note":"뒤에 だんだん・〜くなる・〜ようになる 같은 변화 표현이 와요. ‘규칙·지시에 따르다’의 뜻도 있어요: 説明書(せつめいしょ)にしたがって組(く)み立(た)てる.","q":[{"s":"上(うえ)に行(い)く＿＿、気温(きおん)が下(さ)がっていく。","a":"にしたがって","o":["にわたって","に対(たい)して","に代(か)わって"],"k":"위로 올라갈수록 기온이 내려간다.","why":"높이가 변함에 따라 기온도 변화 → にしたがって."}]},{"id":"j14","topic":"조사·동사 활용 표현","kind":"확신·마음","title":"〜を込(こ)めて","form":"명사 + を込(こ)めて","mean":"~을 담아 (감정·기분을 담아 뒤의 동작을 함)","ex":[["愛情(あいじょう)を/こめて/ケーキを/作(つく)った。","애정을 담아 케이크를 만들었다."],["心(こころ)を/込(こ)めて/プレゼントを/選(えら)んだ。","정성을 담아 선물을 골랐다."]],"note":"心(こころ)・愛(あい)・感謝(かんしゃ)・願(ねが)い 같은 마음을 나타내는 명사와 같이 써요.","q":[{"s":"感謝(かんしゃ)の気持(きも)ち＿＿手紙(てがみ)を書(か)いた。","a":"を込(こ)めて","o":["を通(つう)じて","をめぐって","に加(くわ)えて"],"k":"감사의 마음을 담아 편지를 썼다.","why":"마음을 담아 쓰다 → を込めて."}]},{"id":"j15","topic":"조사·동사 활용 표현","kind":"근거·수단","title":"〜を通(つう)じて・〜を通(とお)して","form":"명사 + を通(つう)じて・を通(とお)して","mean":"~을 통해서 (무언가를 수단·매개로 하여)","ex":[["読書(どくしょ)を/通(つう)じて/知識(ちしき)を/得(え)る。","독서를 통해 지식을 얻는다."],["秘書(ひしょ)を/通(とお)して、/社長(しゃちょう)に/面会(めんかい)を/申(もう)し込(こ)んだ。","비서를 통해 사장님께 면회를 신청했다."]],"note":"‘기간 내내’의 뜻도 있어요: 一年(いちねん)を通(つう)じて暖(あたた)かい (일 년 내내 따뜻하다).","q":[{"s":"友(とも)だち＿＿今(いま)の彼女(かのじょ)と知(し)り合(あ)った。","a":"を通(とお)して","o":["をめぐって","を込(こ)めて","にとって"],"k":"친구를 통해 지금의 여자친구와 알게 되었다.","why":"친구가 매개 → を通して."}]},{"id":"j16","topic":"조사·동사 활용 표현","kind":"대상·관련","title":"〜をめぐって","form":"명사 + をめぐって","mean":"~을 둘러싸고 (주로 논쟁·분쟁의 대상)","ex":[["規則(きそく)の/改正(かいせい)を/めぐって、/いろいろな/意見(いけん)が/出(で)て/いる。","규칙 개정을 둘러싸고 여러 의견이 나오고 있다."],["親(おや)の/遺産(いさん)を/めぐって/兄弟(きょうだい)が/争(あらそ)って/いる。","부모의 유산을 둘러싸고 형제가 다투고 있다."]],"note":"뒤에 議論(ぎろん)・対立(たいりつ)・争(あらそ)う・意見(いけん)が出(で)る 같은 ‘논쟁’ 표현이 와요. について와 달리 의견이 갈리는 상황.","q":[{"s":"新(あたら)しい空港(くうこう)の建設(けんせつ)＿＿、住民(じゅうみん)の意見(いけん)が分(わ)かれている。","a":"をめぐって","o":["を込(こ)めて","を通(つう)じて","に加(くわ)えて"],"k":"새 공항 건설을 둘러싸고 주민들의 의견이 갈리고 있다.","why":"의견이 갈리는 대상(논쟁) → をめぐって."}]},{"id":"m01","topic":"명사 활용 표현 1","kind":"경험·빈도","title":"〜たことがある","form":"동사 た형 + ことが + ある","mean":"~한 적이 있다 (과거의 경험)","ex":[["飛行機(ひこうき)に/乗(の)った/ことが/ありますか。","비행기를 탄 적이 있습니까?"],["こんな/すばらしい/景色(けしき)は/今(いま)まで/見(み)た/ことが/ありません。","이렇게 멋진 경치는 지금까지 본 적이 없습니다."]],"note":"경험은 반드시 た형! 사전형 + ことがある(가끔 ~할 때가 있다)와 헷갈리지 않기.","q":[{"s":"日本(にほん)へは 一度(いちど) 行(い)った＿＿。","a":"ことがあります","o":["ことにしています","ことになります","わけがありません"],"k":"일본에는 한 번 간 적이 있습니다.","why":"一度(한 번) + 과거 경험 → た형 + ことがある."}]},{"id":"m02","topic":"명사 활용 표현 1","kind":"경험·빈도","title":"〜ことがある","form":"동사 사전형 + ことが + ある","mean":"~하는 경우가 있다, 가끔 ~할 때가 있다 (지금도 반복되는 일)","ex":[["ときどき/日本(にほん)の歌(うた)を/歌(うた)う/ことが/あります。","가끔 일본 노래를 부를 때가 있습니다."],["天気(てんき)の/いい日(ひ)は、/ここから/富士山(ふじさん)が/見(み)える/ことが/あります。","날씨가 좋은 날은 여기서 후지산이 보일 때가 있습니다."]],"note":"ときどき・たまに와 잘 어울려요. 〜ないことがある(~하지 않을 때도 있다)도 자주 써요.","q":[{"s":"忙(いそが)しいときは、朝(あさ)ご飯(はん)を食(た)べない＿＿。","a":"ことがあります","o":["たことがあります","ところです","ことになっています"],"k":"바쁠 때는 아침을 안 먹을 때가 있어요.","why":"‘가끔 그럴 때가 있다’ → 사전형(ない형) + ことがある."}]},{"id":"m03","topic":"명사 활용 표현 1","kind":"결정·규칙","title":"〜ことにする","form":"동사 사전형 + ことに + する","mean":"~하기로 하다 (자신의 의지로 결정·결심)","ex":[["新(あたら)しい/車(くるま)を/買(か)う/ことに/した。","새 차를 사기로 했다."],["健康(けんこう)の/ため、/お酒(さけ)を/やめる/ことに/しました。","건강을 위해 술을 끊기로 했습니다."]],"note":"내가 정함 = ことにする / 남·상황이 정함 = ことになる. 〜ないことにする = ~하지 않기로 하다.","q":[{"s":"よし、明日(あした)から 毎日(まいにち) 走(はし)る＿＿！","a":"ことにする","o":["ことになる","ことがある","ところだ"],"k":"좋아, 내일부터 매일 달리기로 하자!","why":"よし! = 스스로 결심 → ことにする."}]},{"id":"m04","topic":"명사 활용 표현 1","kind":"결정·규칙","title":"〜ことになる","form":"동사 사전형 + ことに + なる","mean":"~하게 되다 (자신의 의지보다 외적 요인(사회·회사 등)에 의해 결정됨)","ex":[["急(きゅう)に/海外出張(かいがいしゅっちょう)に/行(い)く/ことに/なった。","갑자기 해외 출장을 가게 되었다."],["来週(らいしゅう)、/パーティーを/する/ことに/なりました。","다음 주에 파티를 하게 되었습니다."]],"note":"자기가 정한 일도 ことになりました로 말하면 겸손하고 부드럽게 들려요 (결혼 발표 등).","q":[{"s":"会社(かいしゃ)の命令(めいれい)で、来月(らいげつ)から大阪(おおさか)で働(はたら)く＿＿。","a":"ことになった","o":["ことにした","ことがある","ところだ"],"k":"회사 명령으로 다음 달부터 오사카에서 일하게 되었다.","why":"회사(외부)가 결정 → ことになった."}]},{"id":"m05","topic":"명사 활용 표현 1","kind":"결정·규칙","title":"〜ことにしている","form":"동사 사전형 + ことに + している","mean":"~하기로 하고 있다 (자신의 습관)","ex":[["私(わたし)は/6時(じ)に/起(お)きる/ことに/して/いる。","나는 6시에 일어나기로 하고 있다."],["毎朝(まいあさ)/走(はし)る/ことに/して/いる。","매일 아침 달리기로 하고 있다."]],"note":"스스로 정해서 지키는 습관. 회사·학교가 정한 규칙은 ことになっている.","q":[{"s":"健康(けんこう)のために、毎日(まいにち) 野菜(やさい)を食(た)べる＿＿。","a":"ことにしている","o":["ことになっている","たことがある","ところだ"],"k":"건강을 위해 매일 채소를 먹기로 하고 있다.","why":"내가 정한 습관 → ことにしている."}]},{"id":"m06","topic":"명사 활용 표현 1","kind":"결정·규칙","title":"〜ことになっている","form":"동사 사전형 + ことに + なっている","mean":"~하기로 되어 있다 (약속·예정이나 단체의 규칙)","ex":[["友(とも)だちと/7時(じ)に/会(あ)う/ことに/なって/いる。","친구와 7시에 만나기로 되어 있다."],["日本(にほん)では、/部屋(へや)に/入(はい)る/とき、/靴(くつ)を/脱(ぬ)ぐ/ことに/なって/いる。","일본에서는 방에 들어갈 때 신발을 벗게 되어 있다."]],"note":"학교 규칙·회사 규정·정해진 일정에 써요. 안내문에서 자주 봐요.","q":[{"s":"この学校(がっこう)では、生徒(せいと)は制服(せいふく)を着(き)る＿＿。","a":"ことになっている","o":["ことにしている","ことがある","わけがない"],"k":"이 학교에서는 학생은 교복을 입게 되어 있다.","why":"학교(단체)의 규칙 → ことになっている."}]},{"id":"m07","topic":"명사 활용 표현 1","kind":"판단·전문","title":"〜ということだ","form":"동사·い형용사·な형용사·명사 보통형 + ということだ","mean":"~라는 것이다, ~라고 한다 (들은 내용을 그대로 전달·전문)","ex":[["来月(らいげつ)から/電車代(でんしゃだい)が/あがる/という/ことだ。","다음 달부터 전철 요금이 오른다고 한다."],["ニュースに/よると、/今年(ことし)の冬(ふゆ)は/とても/寒(さむ)い/という/ことだ。","뉴스에 따르면 올해 겨울은 매우 춥다고 한다."]],"note":"〜そうだ(전문)보다 딱딱한 말. によると와 짝으로 자주 와요. 회화에서는 〜って.","q":[{"s":"天気予報(てんきよほう)によると、明日(あした)は雨(あめ)が降(ふ)る＿＿。","a":"ということだ","o":["ことにする","わけにはいかない","ところだ"],"k":"일기예보에 따르면 내일은 비가 온다고 한다.","why":"によると(정보 출처) + 전달 → ということだ."}]},{"id":"m08","topic":"명사 활용 표현 1","kind":"ところ","title":"〜ところだ","form":"동사 사전형 + ところだ","mean":"~하려는 참이다 (어떤 동작을 하기 직전)","ex":[["これから/食事(しょくじ)を/する/ところです。","지금부터 식사를 하려는 참입니다."],["これから/家(いえ)に/帰(かえ)る/ところです。","지금 집에 돌아가려는 참입니다."]],"note":"これから・今(いま)から와 짝. ところ 3형제: する(직전) / している(진행 중) / した(직후) + ところ","q":[{"s":"「もう出(で)かけた？」「ううん、今(いま)から 出(で)かける＿＿。」","a":"ところ","o":["たところ","ことがある","ものだ"],"k":"“벌써 나갔어?” “아니, 지금 나가려는 참이야.”","why":"今から + 사전형 → 하기 직전 = ところ."}]},{"id":"m09","topic":"명사 활용 표현 1","kind":"ところ","title":"〜ているところだ","form":"동사 て형 + いる + ところだ","mean":"~하고 있는 중이다 (동작이 한창 진행 중)","ex":[["今(いま)/出(で)かける/準備(じゅんび)を/して/いる/ところです。","지금 외출할 준비를 하고 있는 중입니다."],["今(いま)/レポートを/書(か)いて/いる/ところです。","지금 리포트를 쓰고 있는 중입니다."]],"note":"전화나 메시지로 ‘지금 뭐 해?’에 대답할 때 자주 써요.","q":[{"s":"レポートは まだ＿＿です。半分(はんぶん)ぐらい 終(お)わりました。","a":"書(か)いているところ","o":["書(か)いたところ","書(か)くところ","書(か)いたことがある"],"k":"리포트는 아직 쓰고 있는 중이에요. 반 정도 끝났어요.","why":"まだ + 반쯤 끝남 → 진행 중 = ているところ."}]},{"id":"m10","topic":"명사 활용 표현 1","kind":"ところ","title":"〜たところだ","form":"동사 た형 + ところだ","mean":"막 ~한 참이다 (동작이 지금 막 끝남)","ex":[["いま/会議(かいぎ)が/終(お)わった/ところです。","지금 막 회의가 끝났습니다."],["いま/学校(がっこう)から/帰(かえ)って/きた/ところです。","지금 막 학교에서 돌아온 참입니다."]],"note":"〜たばかり(끝난 지 얼마 안 됨, 시간 폭이 넓음)와 달리 〜たところ는 ‘바로 지금’ 끝난 순간.","q":[{"s":"「今(いま) 大丈夫(だいじょうぶ)？」「うん、ちょうど 仕事(しごと)が＿＿だよ。」","a":"終(お)わったところ","o":["終(お)わるところ","終(お)わっているところ","終(お)わったことがある"],"k":"“지금 괜찮아?” “응, 마침 일이 막 끝났어.”","why" const _t=(s,n)=>Object.fromEntries(s.split(",").map(x=>[x.slice(0,n),x.slice(n)]));
const RJ1=_t("あa,いi,うu,えe,おo,かka,きki,くku,けke,こko,さsa,しshi,すsu,せse,そso,たta,ちchi,つtsu,てte,とto,なna,にni,ぬnu,ねne,のno,はha,ひhi,ふfu,へhe,ほho,まma,みmi,むmu,めme,もmo,やya,ゆyu,よyo,らra,りri,るru,れre,ろro,わwa,をo,んn,がga,ぎgi,ぐgu,げge,ごgo,ざza,じji,ずzu,ぜze,ぞzo,だda,ぢji,づzu,でde,どdo,ばba,びbi,ぶbu,べbe,ぼbo,ぱpa,ぴpi,ぷpu,ぺpe,ぽpo,ぁa,ぃi,ぅu,ぇe,ぉo,ゃya,ゅyu,ょyo,ゐi,ゑe",1);
const RJ2=_t("きゃkya,きゅkyu,きょkyo,しゃsha,しゅshu,しょsho,ちゃcha,ちゅchu,ちょcho,にゃnya,にゅnyu,にょnyo,ひゃhya,ひゅhyu,ひょhyo,みゃmya,みゅmyu,みょmyo,りゃrya,りゅryu,りょryo,ぎゃgya,ぎゅgyu,ぎょgyo,じゃja,じゅju,じょjo,ぢゃja,ぢゅju,ぢょjo,びゃbya,びゅbyu,びょbyo,ぴゃpya,ぴゅpyu,ぴょpyo",2);
const KUN1=_t("しsi,ちti,つtu,ふhu,じzi,ぢdi,づdu",1);
const KUN2=_t("しゃsya,しゅsyu,しょsyo,ちゃtya,ちゅtyu,ちょtyo,じゃzya,じゅzyu,じょzyo",2);
function kanaToRomaji(str,kunrei){
  let s="";
  for(const ch of str){const c=ch.codePointAt(0);
    s+=(c>=0x30A1&&c<=0x30F6)?String.fromCodePoint(c-0x60):ch;}
  let out="",i=0;
  while(i<s.length){
    const two=s.substr(i,2);
    if(s[i]==="っ"){const nx=RJ2[s.substr(i+1,2)]||RJ1[s[i+1]]||"";if(nx)out+=nx[0];i++;continue;}
    if(RJ2[two]){out+=(kunrei&&KUN2[two])||RJ2[two];i+=2;continue;}
    if(RJ1[s[i]]){out+=(kunrei&&KUN1[s[i]])||RJ1[s[i]];i++;continue;}
    if(s[i]!=="ー"&&s[i]!==".")out+=s[i];
    i++;
  }
  return out;
}

$("#kLv").innerHTML=LEVELS.map(([v,l])=>`<button class="chip ${v==='ALL'?'active':''}" data-lv="${v}">${l}</button>`).join("");
$("#kSt").innerHTML=STS.map(([v,l])=>`<button class="chip ${v==='all'?'active':''}" data-kst="${v}">${l}</button>`).join("");
document.querySelectorAll("[data-lv]").forEach(c=>c.onclick=()=>{kLevel=c.dataset.lv;
  document.querySelectorAll("[data-lv]").forEach(x=>x.classList.toggle("active",x===c));kRenderList($("#kSearch").value);});
document.querySelectorAll("[data-kst]").forEach(c=>c.onclick=()=>{kSt=c.dataset.kst;
  document.querySelectorAll("[data-kst]").forEach(x=>x.classList.toggle("active",x===c));kRenderList($("#kSearch").value);});

function kFiltered(f){f=f.trim().toLowerCase();
  return KANJI.filter(k=>kInLevel(k)&&kStOK(k)&&(!f||k.char.includes(f)||k.ko.toLowerCase().includes(f)
    ||k.on.join("").toLowerCase().includes(f)||k.kun.join("").toLowerCase().includes(f)
    ||k.en.join(" ").toLowerCase().includes(f)||kRomaji(k).includes(f)));}
function kProgress(){const pool=KANJI.filter(kInLevel);const done=pool.filter(k=>LEARNED.has(k.char)).length;
  const pct=pool.length?Math.round(done/pool.length*100):0;
  $("#kProg").innerHTML=`암기 진도 (${kLevel==="ALL"?"전체":kLevel}) · ${done} / ${pool.length} (${pct}%)<div class="bar"><i style="width:${pct}%"></i></div>`;}
function kRenderList(f=""){const list=kFiltered(f);kView=list;kProgress();$("#kCount").textContent=`${list.length}자`;
  $("#kGrid").innerHTML=list.length?list.map(k=>`
    <div class="cell ${LEARNED.has(k.char)?'learned':''}" onclick="kShow('${k.char}')">
      <span class="lv">${k.level}</span>
      <span class="fav ${FAV.has(k.char)?'on':''}" onclick="event.stopPropagation();kFavCell('${k.char}',this)">★</span>
      <div class="k">${k.char}</div><div class="m">${shortMeaning(k)}</div><span class="chk">✓</span>
    </div>`).join(""):`<p class="empty">조건에 맞는 한자가 없습니다.</p>`;}
function kFavCell(ch,el){toggleSet(FAV,"kanji_fav",ch);el.classList.toggle("on",FAV.has(ch));if(kSt==="fav")kRenderList($("#kSearch").value);}

function wordsBlock(g){return g.map(x=>`<li><span class="mark">${x.r}</span>${x.words.map(wordHTML).join(' , ')}</li>`).join("");}
function kShow(char){
  const k=KANJI.find(x=>x.char===char);if(!k)return;
  const rich=!!k.shape;
  if(!kView.length)kView=KANJI.filter(kInLevel);
  const idx=kView.findIndex(x=>x.char===char);
  const prev=idx>0?kView[idx-1].char:null, next=idx>=0&&idx<kView.length-1?kView[idx+1].char:null;
  kSetView("detail");
  $("#k-detail").innerHTML=`
    ${kBackToVocab?`<div class="backbar" onclick="kBackVocab()">← ${kBackToVocab==="grammar"?"문법으로":"단어장으로"} 돌아가기</div>`:""}
    <div class="nav">
      <a onclick="kSetView('list')">← 목록</a>
      <span>
        <a class="${prev?'':'dim'}" ${prev?`onclick="kShow('${prev}')"`:''}>◀ 이전</a>&nbsp;&nbsp;
        <a class="${next?'':'dim'}" ${next?`onclick="kShow('${next}')"`:''}>다음 ▶</a>
      </span>
    </div>
    <div class="title">「${k.char}」 <button class="spk" onclick="speak('${k.char}')">🔊</button></div>
    <div class="stroke" id="kStroke"><div class="bigk">${k.char}</div></div>
    <div class="meta">JLPT ${k.level} · ${k.strokes}획</div>
    <div class="actions">
      <button class="btn fav ${FAV.has(char)?'on':''}" id="kBFav">★ 즐겨찾기</button>
      <button class="btn chk ${LEARNED.has(char)?'on':''}" id="kBChk">✓ 외웠어요</button>
    </div>
    <div class="sec"><h2>1. 기본 정보</h2><ul>
      <li><span class="mark">의미</span><b>${k.ko}</b> <span class="en">${k.en.join(", ")}</span></li>
      <li><span class="mark">음독</span><span class="jp">${k.on.join("、")||"—"}</span>${k.on.length?`<button class="spk" onclick="speak('${k.on[0]}')">🔊</button>`:""}</li>
      <li><span class="mark">훈독</span><span class="jp">${k.kun.join("、")||"—"}</span>${k.kun.length?`<button class="spk" onclick="speak('${(k.kun[0]||"").split(".")[0]}')">🔊</button>`:""}</li>
    </ul></div>
    <div class="sec"><h2>2. 한자 모양 해설</h2>
      ${rich?k.shape.map(s=>`<p class="note">${s}</p>`).join(""):`<div class="todo">이 한자의 어원 해설은 준비 중입니다.</div>`}
      ${k.tip?`<div class="tip">💡 <b>암기 꿀팁</b> · ${k.tip}</div>`:""}</div>
    <div class="sec"><h2>3. 음독 상세</h2>
      <p class="note">음독은 <span class="jp">${k.on.join("、")||"—"}</span>입니다. ${rich?(k.onNote||""):""}</p>
      ${rich&&k.onWords.length?`<div class="sub">음독 대표단어</div><ul>${wordsBlock(k.onWords)}</ul>`:`<div class="todo">대표단어는 준비 중입니다.</div>`}</div>
    <div class="sec"><h2>4. 훈독 상세</h2>
      <p class="note">훈독은 <span class="jp">${k.kun.join("、")||"—"}</span>입니다. ${rich?(k.kunNote||""):""}</p>
      ${rich&&k.kunWords.length?`<div class="sub">훈독 대표단어</div><ul>${wordsBlock(k.kunWords)}</ul>`:`<div class="todo">대표단어는 준비 중입니다.</div>`}</div>`;
  $("#kBFav").onclick=e=>{toggleSet(FAV,"kanji_fav",char);e.target.classList.toggle("on",FAV.has(char));};
  $("#kBChk").onclick=e=>{toggleSet(LEARNED,"kanji_learned",char);e.target.classList.toggle("on",LEARNED.has(char));};
  kLoadStroke(char);window.scrollTo(0,0);
}
function kLoadStroke(char){fetch(`https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex(char)}.svg`)
  .then(r=>r.ok?r.text():Promise.reject()).then(svg=>{const el=$("#kStroke");if(el)el.innerHTML=svg;}).catch(()=>{});}
function kBackVocab(){const m=kBackToVocab;kBackToVocab=false;setMode(m==="grammar"?"grammar":"vocab");}

/* 한자 카드 */
let kfPool=[],kfIdx=0;
function kStartCard(){kfPool=KANJI.filter(k=>kInLevel(k)&&kStOK(k)).sort(()=>Math.random()-0.5);kfIdx=0;kRenderCard();}
function fcRead(label,readings,groups,speakTxt,cls){
  const rd=readings.length?readings.join("、"):"—";
  const exs=[];
  for(const g of (groups||[])){ for(const w of (g.words||[])){ if(exs.length<2) exs.push(w); } if(exs.length>=2) break; }
  return `<div class="fc-read"><span class="fc-tag ${cls}">${label}</span> <span class="jp rdl">${rd}</span>`
    +(readings.length&&speakTxt?` <button class="spk" onclick="event.stopPropagation();speak('${speakTxt}')">🔊</button>`:"")
    +exs.map(w=>`<div class="fc-ex">${wordHTML(w)}</div>`).join("")+`</div>`;
}
function kRenderCard(){
  const head=`<div class="filters c3 d6">${LEVELS.map(([v,l])=>`<button class="chip ${v===kLevel?'active':''}" onclick="kCardLv('${v}')">${l}</button>`).join("")}</div>
    <div class="filters c3">${STS.map(([v,l])=>`<button class="chip ${v===kSt?'active':''}" onclick="kCardSt('${v}')">${l}</button>`).join("")}</div>`;
  if(!kfPool.length){$("#k-card").innerHTML=head+`<p class="empty">해당 조건의 한자가 없습니다.</p>`;return;}
  if(kfIdx>=kfPool.length){$("#k-card").innerHTML=head+`<p class="empty">🎉 ${kfPool.length}장 학습 완료!<br><br><button class="chip" onclick="kStartCard()">다시 섞기</button></p>`;return;}
  const k=kfPool[kfIdx];
  $("#k-card").innerHTML=head+`
    <div class="navline"><button onclick="kCardMove(-1)" ${kfIdx===0?'disabled':''}>◀ 이전</button>
      <span class="count" style="margin:0">${kfIdx+1} / ${kfPool.length}</span>
      <button onclick="kCardMove(1)">다음 ▶</button></div>
    <div class="fc"><div class="fcard" onclick="this.classList.toggle('flip')">
      <div class="face f"><div class="big">${k.char}</div><div class="fhint">탭하면 뜻 보기</div></div>
      <div class="face b">
        <div class="fc-label">뜻</div>
        <p class="ko">${k.ko}</p>
        <p class="en">${k.en.join(", ")}</p>
        ${fcRead("음독",k.on,k.onWords,k.on[0]||k.char,"on")}
        ${fcRead("훈독",k.kun,k.kunWords,(k.kun[0]||"").split(".")[0],"kun")}
      </div>
    </div></div>
    <div class="fcbtns">
      <button class="dunno" onclick="kCardNext(false)">✗ 모름</button>
      <button class="know" onclick="kCardNext(true)">✓ 외움</button>
    </div>`;
}
function kCardNext(known){const k=kfPool[kfIdx];if(known)LEARNED.add(k.char);else LEARNED.delete(k.char);store.set("kanji_learned",LEARNED);kfIdx++;kRenderCard();}
function kCardMove(d){kfIdx=Math.max(0,Math.min(kfPool.length,kfIdx+d));kRenderCard();}
function kCardLv(v){kLevel=v;kStartCard();}
function kCardSt(v){kSt=v;kStartCard();}

/* 한자 퀴즈 */
let kScore=0,kTotal=0;
function kQuizHead(){return `<div class="filters c3 d6">${LEVELS.map(([v,l])=>`<button class="chip ${v===kLevel?'active':''}" onclick="kQuizLv('${v}')">${l}</button>`).join("")}</div>
  <div class="filters c3">${STS.map(([v,l])=>`<button class="chip ${v===kSt?'active':''}" onclick="kQuizSt('${v}')">${l}</button>`).join("")}</div>`;}
function kNewQuiz(){const pool=KANJI.filter(k=>kInLevel(k)&&kStOK(k));
  if(pool.length<1){$("#k-quiz").innerHTML=kQuizHead()+`<p class="empty">해당 조건의 한자가 없습니다.</p>`;return;}
  const correct=pool[Math.floor(Math.random()*pool.length)];const ask=Math.random()<0.5;
  const label=k=>ask?shortMeaning(k):`<span class="jp">${k.on.concat(k.kun).join("、")||"—"}</span>`;
  // 오답 보기: 같은 등급 한자에서 우선 (보기 글자가 같으면 제외)
  const seen=new Set([label(correct)]),others=[];
  for(const pool2 of [KANJI.filter(k=>k.level===correct.level),KANJI])
    for(const k of pool2.slice().sort(()=>Math.random()-0.5)){
      if(others.length>=3)break;if(k===correct||seen.has(label(k)))continue;seen.add(label(k));others.push(k);}
  const opts=[correct,...others].sort(()=>Math.random()-0.5);
  $("#k-quiz").innerHTML=kQuizHead()+`<div class="quiz"><div class="prompt">${ask?"이 한자의 뜻은?":"이 한자의 읽기는?"}</div>
    <div class="q">${correct.char}</div>
    <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===correct?1:0}" onclick="kAnswer(this)">${label(o)}</div>`).join("")}</div>
    <div class="score" id="kScoreBox">맞힘 ${kScore} / 푼 문제 ${kTotal}</div></div>`;}
function kQuizLv(v){kLevel=v;kNewQuiz();}
function kQuizSt(v){kSt=v;kNewQuiz();}
function kAnswer(el){if(el.dataset.done)return;kTotal++;const ok=el.dataset.c==="1";
  document.querySelectorAll("#k-quiz .opt").forEach(o=>{o.dataset.done=1;if(o.dataset.c==="1")o.classList.add("ok");});
  if(ok)kScore++;else el.classList.add("no");
  $("#kScoreBox").textContent=`맞힘 ${kScore} / 푼 문제 ${kTotal}`;setTimeout(kNewQuiz,950);}

function kSetView(v){
  ["list","detail","card","quiz"].forEach(x=>$("#k-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("[data-kv]").forEach(t=>t.classList.toggle("active",t.dataset.kv===v||(v==="detail"&&t.dataset.kv==="list")));
  if(v==="list")kRenderList($("#kSearch").value);
  if(v==="card")kStartCard();
  if(v==="quiz")kNewQuiz();
}
document.querySelectorAll("[data-kv]").forEach(t=>t.onclick=()=>{kBackToVocab=false;kSetView(t.dataset.kv);});
$("#kSearch").addEventListener("input",e=>kRenderList(e.target.value));
document.addEventListener("keydown",e=>{
  if(mode!=="kanji"||$("#k-detail").classList.contains("hide"))return;
  const a=[...document.querySelectorAll("#k-detail .nav a")];
  if(e.key==="ArrowLeft"&&a[1]&&!a[1].classList.contains("dim"))a[1].click();
  if(e.key==="ArrowRight"&&a[2]&&!a[2].classList.contains("dim"))a[2].click();
});

/* ══════════ 단어장 ══════════ */
let vType="ALL", vSt="all", vChs=new Set(), vMulti=false;
let VFAV=store.get("vocab_fav"), VLEARNED=store.get("vocab_learned");
/* 모름 목록: 카드에서 ✗모름을 누르거나 퀴즈에서 틀린 단어. 카드 ✓외움·퀴즈 정답·목록 ✅ 이면 빠진다 */
let VWRONG=store.get("vocab_wrong");
const VSTS=[...STS,["wrong","✗ 모름"]];
const vWrongN=()=>WORDS.filter(w=>vIn(w)&&VWRONG.has(vid(w))).length;
const vStLabel=(v,l)=>v==="wrong"?`✗ 모름 ${vWrongN()}`:l;
function vMarkUnknown(w){const id=vid(w);VWRONG.add(id);store.set("vocab_wrong",VWRONG);if(VLEARNED.delete(id))store.set("vocab_learned",VLEARNED);}
function vMarkKnown(w){const id=vid(w);VLEARNED.add(id);store.set("vocab_learned",VLEARNED);if(VWRONG.delete(id))store.set("vocab_wrong",VWRONG);}
const vid=w=>w.w+"|"+w.r;
const TYPES=["ALL",...[...new Set(WORDS.map(w=>w.t))]];
const chNum=c=>parseInt(String(c).replace(/\D/g,""))||0;
const CHS=[...new Set(WORDS.map(w=>w.ch))].sort((a,b)=>chNum(a)-chNum(b));
WORDS.sort((a,b)=>chNum(a.ch)-chNum(b.ch));  // 여러 챕터를 모아볼 때 챕터 순서대로
const chLabel=c=>c==="ALL"?"전체":"챕터 "+(chNum(c)||c);
let vCur="list";
/* 선택한 챕터들 (여러 개 가능). 저장: vocab_chs, 예전 단일 선택 vocab_ch 도 읽음 */
try{
  let a=JSON.parse(localStorage.getItem("vocab_chs")||"null");
  if(!a){const o=localStorage.getItem("vocab_ch");a=o==="ALL"?CHS:(o?[o]:null);}
  if(a)vChs=new Set(a.filter(c=>CHS.includes(c)));
  vMulti=localStorage.getItem("vocab_chmulti")==="1";
}catch(e){}
if(!vChs.size)vChs=new Set([CHS[0]]);
const vAllCh=()=>vChs.size===CHS.length;
function vChName(){
  if(vAllCh())return "전체";
  const n=CHS.filter(c=>vChs.has(c)).map(chNum);
  if(n.length===1)return "챕터 "+n[0];
  const run=n.every((x,i)=>i===0||x===n[i-1]+1);
  return "챕터 "+(run?n[0]+"~"+n[n.length-1]:n.join("·"));
}

function vRomaji(w){if(w._rj===undefined)w._rj=kanaToRomaji(w.r,false)+" "+kanaToRomaji(w.r,true);return w._rj;}
function linkify(s){
  return [...s].map(ch=>KSET.has(ch)
    ? `<span class="kl" onclick="event.stopPropagation();openKanji('${ch}')" title="${ch} 한자 정보">${ch}</span>` : ch).join("");
}
function rubyJP(w){return w.w===w.r?w.w:`<ruby>${linkify(w.w)}<rt>${w.r}</rt></ruby>`;}
function openKanji(ch){ if(!KSET.has(ch))return; kBackToVocab=mode==="grammar"?"grammar":"vocab"; setMode("kanji"); kShow(ch); }
/* 단어 속 한자 풀이: 食事 → [食 먹을 식] [事 일 사] (누르면 한자 상세) */
const KMAP=Object.fromEntries(KANJI.map(k=>[k.char,k]));
function kBreak(word){const cs=[...new Set([...word].filter(ch=>KSET.has(ch)))];
  if(!cs.length)return "";
  return `<div class="kbrk">${cs.map(ch=>`<span class="kb" onclick="event.stopPropagation();openKanji('${ch}')"><b>${ch}</b>${shortMeaning(KMAP[ch])}</span>`).join("")}</div>`;}

/* 예문: 【】 = 공부 단어(실제 활용형), 漢字(かな) = 후리가나 */
const exTarget=s=>s.slice(s.indexOf("【")+1,s.indexOf("】"));
function exHTML(s,blankIt){
  if(blankIt)s=s.replace(/【[^】]*】/,"＿＿");
  return jr(s).replace("【",'<span class="tw">').replace("】","</span>");
}
/* 🔊 문장은 한자가 섞인 원문 그대로 읽힌다: 히라가나만 주면 엔진이 단어 경계를 몰라 조사 は를 '하'로 읽는 등 어색해짐 */
const exSay=s=>jplain(s).replace(/[【】]/g,"").replace(/'/g,"");
function exBlock(w,max=2){
  if(!w.ex||!w.ex.length)return "";
  return `<div class="vexs">${w.ex.slice(0,max).map(e=>`<div class="vex">
    <div class="jp">${exHTML(e.jp)} <button class="spk" onclick="event.stopPropagation();speak('${exSay(e.jp)}')">🔊</button></div>
    <div class="ko">${e.ko}</div>${e.form?`<div class="vf">${e.form}</div>`:""}</div>`).join("")}</div>`;
}
function vToggleEx(btn,id){
  const row=btn.closest(".row"),nx=row.nextElementSibling;
  if(nx&&nx.classList.contains("vexrow")){nx.remove();btn.classList.remove("on");return;}
  const w=WORDS.find(x=>vid(x)===id);if(!w)return;
  row.insertAdjacentHTML("afterend",`<div class="vexrow">${exBlock(w,3)}</div>`);btn.classList.add("on");
}

/* 챕터 선택 바: 목록·카드·퀴즈 공통 */
function renderChBar(){
  $("#vChBar").innerHTML=[...CHS,"ALL"].map(c=>{const n=c==="ALL"?WORDS.length:WORDS.filter(w=>w.ch===c).length;
    const on=c==="ALL"?vAllCh():(vChs.has(c)&&!vAllCh());
    return `<button class="chb ${on?'active':''}" onclick="vSelCh('${c}')">${vMulti&&c!=="ALL"?`<span class="ck">${vChs.has(c)?'☑':'☐'}</span>`:""}${chLabel(c)}<span class="n">${n}단어</span></button>`;}).join("");
  const cnt=WORDS.filter(w=>vChs.has(w.ch)).length;
  $("#vChTools").innerHTML=`<span class="chsum">${vMulti?`📚 <b>${vChName()}</b> · ${cnt}단어`:"한 챕터씩 보기"}</span>
    <button class="chip ${vMulti?'active':''}" onclick="vToggleMulti()">${vMulti?'☑ 여러 챕터 모아보기 ON':'☐ 여러 챕터 모아보기'}</button>`;
}
function vSaveCh(){try{localStorage.setItem("vocab_chs",JSON.stringify([...vChs]));localStorage.setItem("vocab_chmulti",vMulti?"1":"0");}catch(e){}}
/* 모아보기 OFF: 누른 챕터 하나만 / ON: 누를 때마다 추가·빼기 (최소 1개) */
function vSelCh(c){
  if(c==="ALL")vChs=new Set(CHS);
  else if(!vMulti)vChs=new Set([c]);
  else if(vAllCh())vChs=new Set([c]);
  else if(vChs.has(c)){if(vChs.size>1)vChs.delete(c);}
  else vChs.add(c);
  vSaveCh();renderChBar();vSetView(vCur);
}
function vToggleMulti(){vMulti=!vMulti;if(!vMulti&&!vAllCh()&&vChs.size>1)vChs=new Set([CHS.find(c=>vChs.has(c))]);vSaveCh();renderChBar();vSetView(vCur);}
/* 목록 필터 칩: 상태(vType·vSt)에서 매번 다시 그림 → 카드·퀴즈에서 바꾼 필터와 항상 일치 */
function vListChips(){
  $("#vTy").innerHTML=TYPES.map(t=>`<button class="chip ${t===vType?'active':''}" onclick="vType='${t}';vRenderList($('#vSearch').value)">${t==='ALL'?'전체':t}</button>`).join("");
  $("#vSt").innerHTML=VSTS.map(([v,l])=>`<button class="chip ${v===vSt?'active':''}" onclick="vSt='${v}';vRenderList($('#vSearch').value)">${vStLabel(v,l)}</button>`).join("");
}

function vIn(w){return (vType==="ALL"||w.t===vType)&&vChs.has(w.ch);}
function vStOK(w){const id=vid(w);return vSt==="all"||(vSt==="fav"&&VFAV.has(id))||(vSt==="unlearned"&&!VLEARNED.has(id))||(vSt==="wrong"&&VWRONG.has(id));}
function vPool(){return WORDS.filter(w=>vIn(w)&&vStOK(w));}
function vFiltered(f){f=f.trim().toLowerCase();
  return WORDS.filter(w=>vIn(w)&&vStOK(w)&&(!f||w.w.includes(f)||w.r.includes(f)
    ||w.ko.toLowerCase().includes(f)||vRomaji(w).includes(f)));}

/* 단어 퀴즈 — 4가지 방식 */
const QMODES=[["mc","객관식"],["rev","뜻 보고 단어"],["type","읽기 직접 쓰기"],["listen","듣고 고르기"],["ctx","예문 빈칸"],["exlisten","예문 듣기"]];
const EXMODE=m=>m==="ctx"||m==="exlisten";
let vScore=0,vTotal=0,vQMode="mc",vQ=null;
try{const m=localStorage.getItem("vocab_qmode");if(QMODES.some(q=>q[0]===m))vQMode=m;}catch(e){}
function vQuizHead(){return `<div class="filters c3 d6">${QMODES.map(([v,l])=>`<button class="chip ${v===vQMode?'active':''}" onclick="vQuizMode('${v}')">${l}</button>`).join("")}</div>

  <div class="filters c4">${VSTS.map(([v,l])=>`<button class="chip ${v===vSt?'active':''}" onclick="vQuizSt('${v}')">${vStLabel(v,l)}</button>`).join("")}</div>`;}
function vQuizPool(){return vPool();}
function vNewQuiz(){let P=vQuizPool();if(EXMODE(vQMode))P=P.filter(w=>w.ex&&w.ex.length);
  if(vSt==="wrong"&&!P.length){$("#v-quiz").innerHTML=vQuizHead()+`<p class="empty">🎉 모름 단어가 없어요! (카드에서 ✗모름·퀴즈에서 틀리면 모이고, ✓외움·정답이면 빠져요)</p>`;return;}
  if(vSt!=="wrong"&&P.length<4){$("#v-quiz").innerHTML=vQuizHead()+`<p class="empty">단어가 4개 이상이어야 퀴즈를 낼 수 있어요.</p>`;return;}
  let c=P[Math.floor(Math.random()*P.length)];
  if(vSt==="wrong"&&vQ&&P.length>1&&c===vQ.c)c=P.find(w=>w!==vQ.c);
  const m=vQMode; let ask="";
  let body="",e=null;
  if(EXMODE(m)){
    // 예문 빈칸: 문장 속 실제 활용형 고르기 / 예문 듣기: 문장 듣고 뜻 고르기
    e=c.ex[Math.floor(Math.random()*c.ex.length)];
    const key=m==="ctx"?(x=>jplain(exTarget(x.jp))):(x=>x.ko);
    const opts=shuffle([e,...vExDistractors(c,e,key)]);
    if(m==="ctx"){ask="빈칸에 알맞은 말은?";
      body=`<div class="gq">${exHTML(e.jp,true)}</div><div class="gqk">${e.ko}</div>
        <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===e?1:0}" onclick="vAnswer(this)"><span class="jp">${jr(exTarget(o.jp))}</span></div>`).join("")}</div>`;}
    else{ask="문장을 잘 듣고 뜻을 고르세요";
      body=`<button class="spk big" onclick="speak('${exSay(e.jp)}')">🔊 다시 듣기</button>
        <div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===e?1:0}" onclick="vAnswer(this)">${o.ko}</div>`).join("")}</div>`;}
  }else if(m==="type"){
    // 한자 단어는 표기를 보고 읽기를, 가나 단어는 뜻을 보고 단어를 쓴다
    const kana=c.w===c.r;
    ask=kana?"이 뜻의 단어를 가나(또는 로마자)로 쓰세요":"읽기를 히라가나(또는 로마자)로 쓰세요";
    body=`<div class="${kana?'qko':'qw'}">${kana?c.ko:c.w}</div>
      <form class="tin" onsubmit="event.preventDefault();vTyped()">
        <input id="vTypeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${kana?'예: ちっとも / chittomo':'예: じゅんび / junbi'}">
        <button class="chip active" type="submit">확인</button></form>
      <button class="linkbtn" onclick="vTyped(true)">모르겠어요 (정답 보기)</button>`;
  }else{
    let key,label,prompt,show;
    if(m==="rev"){key=w=>w.w;label=w=>`<span class="jp">${w.w}</span>`;prompt="이 뜻의 단어는?";show=`<div class="qko">${c.ko}</div>`;}
    else if(m==="listen"){key=w=>w.ko;label=w=>w.ko;prompt="잘 듣고 뜻을 고르세요";
      show=`<button class="spk big" onclick="speak('${c.r}')">🔊 다시 듣기</button>`;}
    else{const askM=c.w===c.r||Math.random()<0.5;key=askM?(w=>w.ko):(w=>w.r);
      label=askM?(w=>w.ko):(w=>`<span class="jp">${w.r}</span>`);prompt=askM?"이 단어의 뜻은?":"이 단어의 읽기는?";show=`<div class="qw">${c.w}</div>`;}
    const opts=[c,...vDistractors(c,key,m!=="mc"||key(c)===c.ko)].sort(()=>Math.random()-0.5);
    ask=prompt;
    body=show+`<div class="opts">${opts.map(o=>`<div class="opt" data-c="${o===c?1:0}" onclick="vAnswer(this)">${label(o)}</div>`).join("")}</div>`;
  }
  vQ={c,e};
  $("#v-quiz").innerHTML=vQuizHead()+`<div class="quiz">
    <div class="prompt">${ask}</div>${body}
    <div id="vFeed"></div>
    <div class="score" id="vScoreBox">맞힘 ${vScore} / 푼 문제 ${vTotal}</div></div>`;
  if(m==="listen")speak(c.r);
  if(m==="exlisten")speak(exSay(e.jp));
  if(m==="type")setTimeout(()=>{const i=$("#vTypeIn");if(i)i.focus();},50);
}
/* 오답 보기: 같은 품사에서만 뽑아 품사로 답이 티 나지 않게.
   읽기가 보기인 문제는 글자 수·첫 글자·겹치는 가나가 비슷한 것을 우선 → 헷갈리는 보기 */
function vDistractors(c,key,randomPick){
  const used=new Set([key(c)]);
  const tiers=[w=>w.t===c.t&&vChs.has(w.ch), w=>w.t===c.t, ()=>true];
  const sim=w=>{let sc=0;const a=[...c.r],b=[...w.r];
    sc-=Math.abs(a.length-b.length)*1.5; if(a[0]===b[0])sc+=2; if(a.at(-1)===b.at(-1))sc+=1;
    b.forEach(ch=>{if(a.includes(ch))sc+=1;}); return sc+Math.random()*2;};
  const out=[];
  for(const t of tiers){
    let cand=WORDS.filter(w=>w!==c&&t(w)&&!used.has(key(w)));
    if(randomPick)cand.sort(()=>Math.random()-0.5);
    else{cand.sort((x,y)=>sim(y)-sim(x));cand=cand.slice(0,8).sort(()=>Math.random()-0.5);}
    for(const w of cand){if(out.length>=3)break;if(!used.has(key(w))){used.add(key(w));out.push(w);}}
    if(out.length>=3)break;
  }
  return out;
}
/* 예문 퀴즈 오답 보기: 같은 품사 단어들의 예문에서 (선택한 챕터 우선) */
function vExDistractors(c,e,key){
  const used=new Set([key(e)]),out=[];
  const tiers=[w=>w.t===c.t&&vChs.has(w.ch), w=>w.t===c.t, ()=>true];
  for(const t of tiers){
    for(const w of shuffle(WORDS.filter(w=>w!==c&&w.ex&&w.ex.length&&t(w)))){
      if(out.length>=3)break;
      const x=w.ex[Math.floor(Math.random()*w.ex.length)];
      if(!used.has(key(x))){used.add(key(x));out.push(x);}
    }
    if(out.length>=3)break;
  }
  return out;
}
/* 채점 후: 맞히면 잠깐 뒤 다음 문제, 틀리면 정답 풀이를 보여주고 [다음] 버튼 */
function vResult(ok){
  const c=vQ.c,id=vid(c);vTotal++;
  if(ok){vScore++;if(VWRONG.delete(id))store.set("vocab_wrong",VWRONG);}
  else vMarkUnknown(c);
  $("#vScoreBox").textContent=`맞힘 ${vScore} / 푼 문제 ${vTotal}`;
  $("#vFeed").innerHTML=`<div class="feed ${ok?'good':'bad'}">
      <div class="fh">${ok?'⭕ 정답!':'❌ 아쉬워요'}</div>
      <div class="fw">${rubyJP(c)} <button class="spk" onclick="speak('${c.r}')">🔊</button></div>
      <div class="fk">${c.ko}</div>${kBreak(c.w)}${exBlock(vQ.e?{ex:[vQ.e]}:c,1)}
      ${ok&&!vQ.e?'':`<button class="chip active nextb" onclick="vNewQuiz()">다음 문제 ▶</button>`}</div>`;
  if(ok&&!vQ.e)setTimeout(()=>{if(vQ&&vQ.c===c&&vCur==="quiz")vNewQuiz();},1300);
  else{const b=$("#vFeed .nextb");if(b)b.focus();}
}
function vAnswer(el){if(el.dataset.done)return;const ok=el.dataset.c==="1";
  document.querySelectorAll("#v-quiz .opt").forEach(o=>{o.dataset.done=1;if(o.dataset.c==="1")o.classList.add("ok");});
  if(!ok)el.classList.add("no");vResult(ok);}
/* 주관식: 히라가나·가타카나·로마자 모두 허용, 장음 표기 차이(ou/oo/uu 등)와 な형용사의 だ 생략도 인정 */
function hira(s){return [...s].map(ch=>{const c=ch.codePointAt(0);return (c>=0x30A1&&c<=0x30F6)?String.fromCodePoint(c-0x60):ch;}).join("");}
function rjNorm(s){return s.toLowerCase().replace(/[^a-z]/g,"").replace(/jy/g,"j").replace(/m(?=[bmp])/g,"n").replace(/([aiueo])\1/g,"$1").replace(/ou/g,"o").replace(/ei/g,"e");}
function vTyped(giveUp){
  if(!vQ||$("#vTypeIn").disabled)return;
  const c=vQ.c,raw=$("#vTypeIn").value.trim().replace(/\s/g,"");
  if(!giveUp&&!raw)return;
  const ans=c.w===c.r?c.w:c.r, alt=ans.replace(/だ$/,"");
  let ok=false;
  if(!giveUp){
    const h=hira(raw);
    if(/[a-zA-Z]/.test(raw)){const n=rjNorm(raw);ok=[ans,alt].some(a=>rjNorm(kanaToRomaji(a,false))===n||rjNorm(kanaToRomaji(a,true))===n);}
    else ok=[ans,alt].some(a=>hira(a).replace(/ー/g,"")===h.replace(/ー/g,""));
  }
  $("#vTypeIn").disabled=true;$("#vTypeIn").classList.add(ok?"ok":"no");
  vResult(ok);
}
function vQuizMode(m){vQMode=m;try{localStorage.setItem("vocab_qmode",m);}catch(e){}vNewQuiz();}
function vQuizTy(t){vType=t;vNewQuiz();}
function vQuizSt(v){vSt=v;vNewQuiz();}

function vSetView(v){vCur=v;
  ["list","card","quiz"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("[data-vv]").forEach(t=>t.classList.toggle("active",t.dataset.vv===v));
  if(v==="list")vRenderList($("#vSearch").value);
  if(v==="card")vStartCard();
  if(v==="quiz")vNewQuiz();
}

/* ══════════ 문법 ══════════ */
const G=window.GRAMMAR;
const GTOPICS=[...new Set([...Object.keys(G.topics),...G.items.map(i=>i.topic)])];
let gTopic=GTOPICS[0], gKind="ALL", gCur="list";

const shuffle=a=>a.slice().sort(()=>Math.random()-0.5);
/* 표기: 漢字(かな) → 후리가나, '/' 는 배열 퀴즈용 경계라 지움, ＿＿ → 빈칸 */
function jr(s){
  return s.replace(/\//g,"")
    .replace(/([一-鿿々]+)\(([ぁ-ゟー]+)\)/g,(m,b,rd)=>`<ruby>${linkify(b)}<rt>${rd}</rt></ruby>`)
    .replace(/＿＿/g,'<span class="blank"></span>');
}
const jplain=s=>s.replace(/\//g,"").replace(/\(([ぁ-ゟー]+)\)/g,"");
const say=s=>`<button class="spk" onclick="event.stopPropagation();speak('${jplain(s).replace(/'/g,"")}')">🔊</button>`;
const gItems=()=>G.items.filter(i=>i.topic===gTopic&&(gKind==="ALL"||i.kind===gKind));
const gKinds=()=>["ALL",...new Set(G.items.filter(i=>i.topic===gTopic).map(i=>i.kind))];
const gTable=()=>G.tables[gTopic]||null;
const gUseTable=()=>gTable()&&(gKind==="ALL"||gKind==="특별경어");

function gTableHTML(){
  const T=gTable();if(!T)return "";
  const cell=c=>c==="—"?'<span class="none">—</span>':c.split("・").map(jr).join("<br>");
  return `<table class="gtbl"><tr><th style="width:30%">기본형</th><th>존경어 ↑ (상대)</th><th>겸양어 ↓ (나)</th></tr>
    ${T.map(r=>`<tr><td>${jr(r[0])}<span class="ko">${r[3]}</span></td><td>${cell(r[1])}</td><td>${cell(r[2])}</td></tr>`).join("")}</table>`;
}
function gRenderBar(){

  const K=gKinds();
  $("#gKind").className="filters c"+(K.length<=5?K.length:K.length%3===0?3:4);

/* 설명(목록) */
